  h += sec('sleep', 'Sleep', 3) + `<p>A tired creature takes a nap (or you send it to sleep). Asleep it <b>stays put</b>: legs folded, breathing slowly, no walking, no flocking, and the wind doesn't push it. Sleep is when it <b>rests</b> (tiredness drains away instead of building up, so the longer it was tired the longer it naps, from about 20 seconds to a minute and a half), <b>heals</b> faster when hurt, and <b>dreams</b>: its mind stream slows and its memories drift through it. Fully rested, it wakes a little early. 💤 floats over sleepers.</p><p>The two originals (Crawly and Id|le) can't be put away, because the trained models live in them; their card offers <b>💤 nap</b> instead, a couple of minutes asleep where they stand.</p>`;
  h += sec('card', 'The creature card', 3) + `<p>Clicking a creature opens its <b>card</b> at the side of the world, away from the creature, with a line tying it to its creature wherever it walks. Drag the card by its header to put it anywhere (it remembers the spot); double-click the header to dock it beside the creature again. Four tabs, the mind first:</p><ul><li><b>mind</b>: the stream of what goes on inside it (see The mind).</li><li><b>profile</b>: name, body, job, food, feelings, mood ribbon, likes, genes and what it has done.</li><li><b>friends</b>: everyone it has spent ten minutes with, its reels, and the memories it shares with them.</li><li><b>memories</b>: what it remembers (click one to see the scene) and the whole diary.</li></ul><p>Along the bottom: 😤 hangry, mutate, ×3, revert, ♥ keep (saves its body plan as a blueprint in Designs), clone, and <b>rest</b>, which puts it away: it keeps its name, memories and friends, frees a place, and wakes again from the creatures sidebar.</p>`;
  { const ORF = (/fetch\('(oracle_\w+\.onnx)'\)/.exec(code) || [])[1] || 'the Oracle model', INF = (/fetch\('(arena_instr_v\d+\.json)'\)/.exec(code) || [])[1] || '';
    const seedsAt = code.indexOf('const ORACLE_SEEDS'), SEEDS = seedsAt < 0 ? [] : [...code.slice(seedsAt, code.indexOf('};', seedsAt)).matchAll(/^\s+(\w+): /gm)].map(m => m[1]);
    const SEEDW = { handover: 'a word changes hands', fetched: 'something is fetched', refused: 'a creature ignores you', sleeping: 'one falls asleep', held: 'you pick one up', mutated: 'one mutates' };
    h += sec('oracle', 'The Oracle', 3) + `<p>The <b>Oracle</b> is the voice in the chat that talks about the world: “It brought “ball”. That is its idea of a reply”. It is a <b>tiny language model</b> made for this world (<code>${esc(ORF)}</code>, <span id="oraSize">about 10.8 MB</span>), and it runs on your own device, in a background worker, so a sentence never freezes the world. Nothing you type to it leaves your browser.</p>
    <p>It speaks when something happens: ${SEEDS.map(k => SEEDW[k] || k).map(esc).join(', ').replace(/, ([^,]*)$/, ' or $1') || 'a word changes hands, something is fetched, a creature ignores you'}, or the weather changes. The game writes the start of a line for the moment and the Oracle carries on in its own words, so it rarely says the same thing twice.</p>
    <p>It also <b>understands what you type</b>. Say “fetch the ball” and a small classifier reads the Oracle's own reading of your sentence, picks an action (<span id="oraOpts">fetch, bring, chop, hand, come, sleep, hide, greet, or none</span>; <i>none</i> means chit-chat, and the creature carries on with its own plans) and finds the word you meant on the floor. It is learned, not a list of keywords, so it gets things wrong sometimes<span id="oraAcc"></span>.</p>
    <p>On iPhones and iPads it thinks on one thread. If the page ever crashes while loading, the next load runs lighter (the Oracle on one thread, light graphics), and after a second crash the Oracle stays off: creatures still live, they just say less. Want a chattier helper? <a href="#your-ai">Connect your own AI</a>; the Oracle keeps narrating either way.</p>`;
    if (INF) setTimeout(async () => { try { const d = await (await fetch(INF, { cache: 'no-store' })).json(); const o = d.options.filter(x => x !== 'none'); $('#oraOpts').textContent = o.join(', ') + ', or none'; $('#oraAcc').textContent = ` (on sentences it never saw, it picks the right action ${Math.round(d.heldout.option_acc * 100)}% of the time)`; } catch (e) {} }, 0);
    setTimeout(async () => { try { const r = await fetch(ORF, { method: 'HEAD' }), n = +r.headers.get('content-length'); if (r.ok && n > 1e6) $('#oraSize').textContent = (n / 1e6).toFixed(1) + ' MB'; } catch (e) {} }, 0); }
  h += sec('space', 'Personal space', 3) + `<p>Every creature has a <b>personal space</b>: how many others it is comfortable having within a step, read from its <b>flocking</b> gene (it evolves with it). Loners are happy with one or two close by, the most social want eight or more. The card says which: <i>a loner, happy with 1 close by</i>, <i>loves company, up to 8 close by</i>.</p><p><b>Loners</b> packed past their comfort get <b>stressed</b> (and less happy and relaxed), stop being pulled along by their flock and <b>edge away</b>, sometimes to the lake's quiet shore. <b>Social</b> ones in good company, friends most of all, get a small lift; left alone for several minutes they start to <b>miss the others</b> (they feel left alone). A crowd also makes food go faster: hunger rises a little quicker when packed, and hungry creatures in a crowd steal more. Memories, mind lines and the gazette mark the moments: <i>too many legs here</i>, <i>love a crowd</i>, the first party, the first hermit. Togetherness on its own is never a problem in the advisor; it only raises <b>loners are stressed in a crowd</b> (three or more, about 8% of them), with <b>🫧 give the loners room</b> (each goes to the quietest spot nearby, or the shore) and <b>↔️ spread them out</b>.</p>`;
  h += sec('looks', 'Showy, shy and dazzle herds', 3) + `<p>Every creature carries a <b>showiness</b> gene (0 to 1), passed on to its children and nudged by mutation; social creatures lean showy. <b>Showy</b> ones glow softly in their own colour, pulse when they're happy or dancing, and leave little <b>ripples</b> where their feet land. <b>Shy</b> ones are camouflaged: they fade toward the floor under them and leave no trace. When shy kin move together they form a <b>dazzle herd</b>: they share a stripe pattern, so the herd reads as one moving mass and no single member stands out.</p><p>It matters to them. Showy creatures make friends faster, but they get noticed: thieves pick them first and scares find them more often. Shy ones are robbed less (a thief can lose track of them, more so in a herd) and scared less, but they make friends more slowly. The card shows each creature's looks.</p><p><b>Outlines.</b> Every creature is drawn with a thin <b>outline</b> round its body and legs, so it reads on the bare floor, on top of charts and among the words, on phones too: a dark ink line in light mode, and in dark mode a light line in the creature's own colour. Showy and plain creatures get the full outline; <b>shy ones keep only a faint one</b>, so they still blend in but never vanish into a chart (hover one or highlight creatures and theirs comes back in full).</p><p>For you: in a busy view plain creatures also get a faint halo so they stand apart from the word-bricks, the one under your pointer gets a ring, and <b>highlight creatures</b> (⚙ settings, the ✨ tile on phones, tap or hold <b>H</b>) rings every one, camouflaged or not.</p>`;
  h += sec('babies', 'Children', 3) + `<p>Creatures have children of their own. Two <b>good friends</b>, close together, both well fed, rested and not scared, now and then have a child (sometimes <b>twins</b>); very rarely a loner with nobody about <b>buds</b> a near-copy of itself. Each of the child's genes comes from one parent or a blend of both (tastes such as charts or counting come whole from one), then a small mutation, the same kind evolution makes. Its family and the style of its name follow a parent. It starts small and grows with every meal, and only a grown creature can become a parent; parents rest a while after a birth.</p><p>Births need <b>food nearby</b> and <b>room</b>: friends packed past their personal space have none. Each world has a <b>population cap</b> (studio → <b>Children</b>, 60 by default): at the cap births simply stop, and nobody is ever removed. The same strip turns children off for that world. Parents and child remember the day in their diaries and become friends; the family tree shows both parents (the second as a dotted pink line); the Gazette has the first baby, the first twins and the first child of two families; a birth is a replay moment and makes a reel, <i>A new arrival</i>; the almanac logs every birth, and the advisor says how many there were in the last hour and, when there are none, why.</p>`;
  h += sec('trees', 'Family trees', 3) + `<p>Every creature has a record of where it came from: its <b>parent</b>, its <b>generation</b> (founders are generation 0), when it was born, the genomes it has carried and what changed each time. Open <b>🌳</b> in the top bar, pick a family, and its trees are drawn generation by generation, each creature as a tiny portrait. The label on a line is the gene in which a child differs most from its parent. Drag to pan, scroll to zoom, click a creature for its card (or, if it is gone, for what is known about it).</p><p>The game never invents ancestry; it reads what the genomes already carry. A <b>clone</b> keeps the id of the one it was copied from plus a short mark, so its parent is certain. A creature <b>mutated</b> from another genome names that genome as its parent. A <b>metamorphosis</b> (wings, a new body) is the same creature changing, not a child. When none of that can be read, the creature is a root marked <b>? unknown origin</b>. When several clones name a genome nobody recorded carrying, they share an <b>unrecorded ancestor</b> (dashed). Gone creatures stay in the tree, faded; resting ones show 💤.</p><p>Highlights: the founders, the <b>longest line</b>, who has had the <b>most children</b>, <b>extinct branches</b> (a branch with nobody left here or resting), and how a chosen gene <b>drifted</b> from generation to generation, on average and down the longest line. A new deepest generation and the first great-grandchild make the Gazette. The card's friends tab shows the family line with <b>↗ tree</b>. Everything exports as CSV or JSON (one row per creature: id, parent, generation, genes) for your own studies, and rides along in snapshots without ever losing a record.</p>`;
  h += sec('world', 'The world'); h += `<p class="hat">The ground, the sky and the places creatures live in.</p>`; h += sec('weather', 'Weather', 3) + pic('storm', 'a packet storm at night, with a volcano and a tornado') + `<p>The world always has one weather, at some intensity. Creatures notice it: they spend time in each, learn which they like, and say so when it turns. Each weather has its own settings in the studio.</p><table class="wt"><tr><th>Weather</th><th>Settings</th></tr>${Object.entries(WN).map(([k, v]) => `<tr><td>${esc(v)}${k === worldNow.weather ? ' <small class="note">← now, in your world</small>' : ''}</td><td class="note">${(WXS[k] || []).map(s => esc(s[1])).join(', ') || '—'}</td></tr>`).join('')}</table><p>There is also a <b>day</b>: dawn, day, dusk, night and before dawn, with light to match. Creatures count the days they have lived through.</p>`;
  h += sec('ground', 'Ground features', 3) + `<p>Under the words the ground has features, made when a world is made and reshuffled when it evolves: ${FEATS.map(f => `<b>${esc(f)}</b>${{ stream: ' (a current that carries words and creatures along)', well: ' (a latency well: everything inside moves slowly)', hole: ' (a small hole)', cache: ' (a cache, a patch where things are kept)' }[f] || ''}`).join(', ')}.</p>`;
  h += sec('disasters', 'Disasters', 3) + `<p>Now and then, or when you start one from the studio (or the AI does, if you let it), ${Object.values(DIS).map(esc).join(', ').replace(/, ([^,]*)$/, ' or $1')} strikes:</p><ul><li><b>🌋 a volcano</b> heaves up through the floor, pushing words, objects and creatures aside as its cone rises, and spews page code.</li><li><b>🌪 a tornado</b> wanders across the world and carries what it passes: words, charts, crates, creatures (pinned things hold), and drops them somewhere else.</li><li><b>〰 an earthquake</b> shakes everything and cracks the floor.</li></ul><p>Words fly, creatures are scared (timid ones hide, hangry ones don't care), buildings lose pieces that Architects come back to fix, and everyone present remembers it: in their diaries, the Gazette, the almanac and the reels. Off-screen disasters show on the minimap. In the studio's Disasters strip a world's disasters can come <i>now and then</i>, or only when you start one.</p>`;
  h += sec('places', 'Places', 3) + `<p>Home is the world of words. Creatures can also travel: to a <b>captured web page</b> (its words become ground they can walk on), to the <b>data lab</b> (where classifier creatures sort a stream of messages as a team), to <b>connected worlds</b> (other browsers' worlds, where they visit as guests), and to <a href="#gloamhold">Gloamhold</a>, a keep in one bit. Each place keeps its own state; leaving never deletes it.</p>`;
  { const CR = /MAXP = (\d+), DEPTH = (\d+)/.exec(code) || [0, 15, 2];
    h += sec('travel', 'Getting around: the minimap, travel and the Crawler', 3) + `<p>The <b>minimap</b> in the bottom corner is the whole world at once: click or drag on it to look somewhere else. Disasters happening off screen show on it, and the <b>+</b> buttons at the world's edges add space on that side (in Gloamhold, a new wing).</p>
    <p><b>Travel</b> takes the creatures to a real web page. Paste an address in the <a href="#studio">studio</a>'s feed and press <i>visit</i>: the page opens as its own place, at its own width and in its own styles, and the creatures walk on its words while you scroll down it. Your home world is set aside untouched and comes back with every creature where it was; the data lab, snapshots and autosave stay at home. (<i>Grow world</i> instead turns a page's words into floor in your own world.)</p>
    <p>The <b>Crawler</b> is a creature that goes out on the web for you. Add one from the special creatures in 🐾 creatures and give it a list of web addresses: it visits them for real, brings back the words that sit closest in meaning to what is already on your floor, plus a picture, and follows the two links that look closest to your world, up to ${CR[2]} links deep and ${CR[1]} pages in all. Closeness is measured with sentence vectors, or with the world's own word vectors when those are not available. On id-le.com, reading pages for travel and for Crawlers goes through the <a href="#settings">public helper</a>.</p>`; }
  h += sec('gloamhold', 'Gloamhold', 3) + pic2('home', 'Home, the floor of words', 'gloamhold', 'Gloamhold, in one bit') + `<svg class="onebit" viewBox="0 0 120 80" width="180" height="120" role="img" aria-label="an arch, a torch and a bat, in one bit"><defs><pattern id="d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000"/><rect x="1" y="1" width="1" height="1" fill="#000"/></pattern><pattern id="d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000"/></pattern></defs><rect width="120" height="80" fill="#fff"/><rect width="120" height="52" fill="url(#d50)"/><path d="M40 52V30a20 20 0 0 1 40 0v22z" fill="#fff" stroke="#000"/><path d="M46 52V31a14 14 0 0 1 28 0v21z" fill="#000"/><circle cx="20" cy="24" r="11" fill="#fff"/><circle cx="20" cy="24" r="11" fill="url(#d25)"/><rect x="18" y="24" width="4" height="10" fill="#000"/><path d="M20 15l2 4-2 4-2-4z" fill="#000"/><path d="M92 14l4 2 3-2 3 2 4-2-2 4h-10z" fill="#000"/><rect y="52" width="120" height="1" fill="#000"/><path d="M0 66h120M30 53v13M90 53v13M60 66v14" stroke="#000" stroke-dasharray="1 2"/></svg>`
    + `<p><b>Gloamhold</b> ${ICONS.keep || '🕯️'} is a place on the places bar, always there next to Home: a stone keep drawn <b>one bit per pixel</b>, in the spirit of the black-and-white computer games of the mid-1980s (it is its own keep, not any game's). Words are set in a bitmap-style face in boxes with a hard shadow, and creatures are pushed to black and white (they keep their shapes and legs, so you can still tell them apart).</p>`
    + `<p><b>The keep is generated.</b> A seed and a few genes (${Object.keys(KEEPGENES).map(k => '<i>' + esc(k) + '</i>').join(', ') || 'room size, clutter, gloom, wall tone, torches, bats, fog'}) split the floor into rooms, each with its own floor (flagstones, planks, cobbles, checker, herringbone or dirt), walls with doorways, torches and cobwebs. The kinds of room: ${Object.values(KEEPROOMS).map(k => '<b>' + esc(k) + '</b>').join(', ') || 'halls, libraries, crypts, chapels, a throne room, cisterns, galleries, cellars, stairwells'}. Halls have pillars and banners, libraries shelves of books, crypts tombs and candles, chapels pews and windows letting moonlight onto the floor, cisterns a pool that ripples, galleries statues and gargoyles, cellars barrels and crates; every keep has one throne room, the biggest. Above it all, the great arches of the north wall, bats and a slow dither fog.</p>`
    + `<p><b>It changes.</b> Evolving the world while you are in the keep (the studio's evolve, or ⟳ mutate) changes the keep itself: a room splits in two, a wall comes down, a crypt becomes a library, rooms are rearranged or get new floors, and the genes drift (undo puts it back). Reshuffle refurnishes every room. The grow buttons at the minimap work here too: each adds a new wing on that side, with rooms of its own.</p>`
    + `<p><b>Weather</b> is drawn in one bit: rain falls as streaks (and bit rain as tiny 0s and 1s) that splash and leave puddles which spread and later dry; in a storm lightning flips the stone black for white and the floor shakes with the thunder; static falls as snow; wind blows streaks across and sways banners, chains and torch flames; fog thickens; the hum shows as a pulsing grid. The creatures live through it as at home (they hide from lightning, like or dislike it).</p>`
    + `<p>The first visit lays a floor of ${KEEPW.length || 'about fifty'} night words (${KEEPW.slice(0, 10).map(w => '<i>' + esc(w) + '</i>').join(', ')}…). Like every place it keeps its own state: its plan, what the creatures eat, carry and build there stays there when you leave, it is in snapshots taken there, and the world at home is untouched. It is a one-off: the 1-bit look belongs to this place only, not (yet) a style any world can switch to.</p>`;
  h += sec('lake', 'The lake, the almanac and the data ocean', 3) + pic2('lake', 'a lake with data fish', 'almanac', 'the almanac') + `<p>Every world has a <b>lake</b>, in its own style: soft blue water with drifting 0s and 1s at Home, a 1-bit black mere with white glints in Gloamhold. Each lake gets a name (Lake Buffers, the Pool of Stray Letters, the Black Mere…). <b>Rain and storms fill it</b>, and clear days slowly lower it. While it rains, loose words near the shore drift in and dissolve into <b>data fish</b>, letters that swim in circles. There are never more than ${24} fish, so no word is lost for long: hungry creatures on the shore <b>fish them back out</b> as words.</p><p>The lake is a <b>refuge</b>. A scared creature runs for the shore when it is close, fear fades much faster by the water, scares are rarer there, and getting calm is a memory ("calmed down by the Black Mere"). The advisor's fear issue offers 🌊 <i>walk the scared ones to the lake</i>. Creatures on the shore drink (it rests them) and gossip about what the almanac remembers.</p><p><b>The almanac</b> is the data lake itself: click the water, or 🌊 in the top bar. Every world <b>keeps its history</b> for real. The advisor's gauges are sampled once a minute and rolled up into hours and days: minutes are kept for 2 days, hours for 90 days, days for good. Alongside them sit who joined and who left (and how), and an event log: disasters, weather, names, raves, reels, friendships, hangry moments and thefts (counted every time, written down now and then), and the whole Id|le gazette. It shows trends by day, week, month, year and all time; population, new members, a sample of the gazette, the top reels (stars, plays, memories), and records and firsts. <b>🌊 all worlds</b> is the <b>data ocean</b>, every world together. Time is real time, and each world has an age (year 1, month 1, day 1 at first). A <b>research export</b> saves the raw history as JSON or CSV on your computer: nothing is uploaded. The history lives in this browser (IndexedDB, with or without a server), and the recent part rides along in snapshots and in the disk copy.</p>`;
  h += sec('objects', 'Solid objects and buildings', 3) + pic('build', 'a hut and a pen built by Architects') + `<p>Some things in the world are <b>solid</b>. They come in each world's own style: <b>crates of bits</b>, <b>word-bricks</b> (a brick that carries a word), <b>data boulders</b> and <b>server racks</b> with blinking lights at Home, and stones, crates, bricks and <b>pillars</b> in 1-bit in Gloamhold. Creatures can't walk through them: they slide along them, steer round what's ahead, and take a short detour when they get stuck behind a corner.</p><p>Small ones (crates, bricks, stones) can be carried and pushed: a big creature shoves them as it walks, strong wind nudges them, a tornado drags them round and a volcano throws them out of the way. Big ones stay put. Each world starts with a few <b>quarries</b>, piles of small things, and a handful of big ones; the studio's <b>Objects</b> section adds more.</p><p><b>Your hand:</b> drag any object to move it. One you moved stays where you put it, and the creatures leave it alone. Click one to 📌 pin it (nothing moves it then), turn it, or remove it.</p><p><b>Architects</b> are the builders. One moves into each world. They carry loose small objects, one at a time, into a plan laid out as dotted outlines, and when the quarries run dry they press a long word into a new brick. They build a <b>hut</b> with a door: a shelter where scares are much rarer and fear fades fast, and scared creatures run for it, round to the door and in. They also build a <b>pen</b>, a quiet room that loners drift to and where tiredness drops; a <b>wall</b>, a windbreak with no wind push in its lee; and a <b>bench</b> by the lake to sit on. Each Architect has its own taste in shapes. A finished building gets a name from the words around it, and a Namer is credited if one lives here. A piece knocked out by a tornado, a volcano or your hand leaves a gap, and an Architect comes back to fix it. Building shows up in diaries, the Gazette ("the first building"), the almanac and replays. Objects and buildings are kept per world, in snapshots too.</p>`;
  h += sec('code', 'Charts, code as food, and charts breaking', 3) + pic('charts', 'charts on the floor, plotted by Mathematicians') + `<p>Counters leave numbers lying around; <b>Mathematicians</b> turn them into formulas and plot them (ten kinds of chart, eight palettes, data from formulas or from the world itself: who lives here, word lengths, the mood lately). Each Mathematician develops a <b>taste</b> for some kinds of chart over time.</p>` + `<p>Charts don't pile up. <b>Debuggers</b> take a chart that has been left alone for about 10 minutes of play apart into its <b>code</b>: it crumbles and falls out as tokens such as <code>&lt;path</code>, <code>plot(</code>, <code>x=</code>, <code>=&gt;</code>, <code>fill</code>, a word of Id|le, bits of its formula and some of its numbers (the numbers it was made from come back as number words). Code tokens are words on a dark chip in monospace.</p><p><b>Code is food.</b> Debugger kin and about a third of Tok kin (a gene, passed on and now and then flipped) eat code; when there's little code about they eat short words. Short code tokens (<code>x</code>, <code>fn</code>, <code>sin</code>) also suit the short-word eaters, and the numbers go to Counter kin. Code eaters also <b>bite charts directly</b> once a chart has been on the floor about 5 minutes of play: each bite takes a point off the curve and drops a code token, and the last bites break what's left into code. Pinned charts are never touched. The advisor's food line shows the code supply.</p><p><b>The chart ecology.</b> A world has room for a comfortable number of charts: <b>10, plus 0.4 for every creature</b> (so 10 to 36; a world of 20 creatures settles around 18, one of 45 around 28). Below that nothing changes. Past it the floor is <b>full</b>, and the fuller it is, the harder the world leans back, without deleting anything:</p><ul><li><b>Charts age faster.</b> Grazers, code eaters and Debuggers treat a chart as old sooner (at twice the comfortable number, in about a quarter of the time).</li><li><b>Mathematicians slow down.</b> Instead of plotting yet another chart, a Mathematician often <b>replots one of its own old charts</b> (a new formula and look from the same two numbers, so the count stays the same) or goes back to counting.</li><li><b>Others lend a hand.</b> Creatures without a craft of their own, code eaters most of all, now and then break an old chart into code like a Debugger would. Their diaries say so.</li><li><b>Debuggers are born when needed.</b> A child born into a full world with too few Debuggers (fewer than one per 12 creatures) has an even chance of growing up a Debugger, whatever its parents do.</li></ul><p>Charts still end the same ways: as numbers grazed back off them, or as code that others eat. Measured on a copy of a busy world (47 creatures, four Mathematicians, one Debugger): before this, its 58 charts grew to 100 in 14 minutes and kept climbing; now they come down within two minutes and stay at 33 to 36, a little above its comfortable 29, while the Mathematicians keep plotting (and replotting). A new starter world (one Mathematician, no Debugger) had gone from 4 charts to 15–22 by then and keeps growing until it reaches its comfortable 15; from there on the same brakes apply.</p>`;
  h += sec('features', 'Things to do'); h += `<p class="hat">What you can do with a world, and what it does on its own: films, music, news, the studio, keeping things, classifiers and other people's worlds.</p>`;
  h += sec('around', 'Getting around', 3) + `<p><b>Zoom.</b> A world opens at <b>100%</b>. Zoom with the mouse wheel or a trackpad pinch, two fingers on a phone, or the <b>zoom control</b>: on a computer it sits at the lower left of the minimap (− · zoom level · +), on a phone it is a thin slider with big + and − buttons at the right edge. Double-click or double-tap the percentage to go back to 100%. You can zoom in to ${pc(ZMAX_)}; on a computer you can zoom out until the whole world fits, on phones and iPads only to ${pc(+ZPH[2])}, because a phone's browser closes the page when too much of the world is drawn at once (the minimap is the overview there). Drag the floor to look around; the world wraps at every edge, and a click on the minimap jumps there.</p><p><b>Three ways to talk.</b> <b>${esc(NM.irc.icon + ' ' + NM.irc.long)}</b> is the world's own chat: the creatures and the world talk there, and what you type goes to the creatures (“fetch the ball word”, “come here”). <b>${esc(NM.op.icon + ' ' + NM.op.short)}</b> is the AI <i>you</i> bring, and it can change this world (see <a href="#your-ai">with your own AI</a>). The <a href="#datalab">🧪 data lab</a> isn't a chat at all: it's a team of classifier creatures sorting a stream of messages.</p><p><b>On phones.</b> Four buttons stay at the top (creatures, 🔔, studio and ☰ for everything else, including ${esc(NM.irc.short)}, the ${esc(NM.op.short)} and sound), and panels open as sheets from the bottom. If the page ever crashes while it loads, the next load starts <b>lighter</b> (the Oracle thinks on one thread, light graphics) and says so; after a second crash in a row it starts with the Oracle off, so the creatures still live but say less. A load that survives 40 seconds counts as healthy again.</p>`;
  { const RK = lit('REEL_KINDS') || {}; h += sec('reels', 'Memory reels', 3) + pic('reel', 'a memory reel playing a replay') + `<p>Now and then the world puts a handful of memories together into a short film, a <b>memory reel</b>. It looks through every creature's diary for strong moments (firsts, friendships, disasters, strong feelings, milestone dawns, things you did), prefers variety over repeats, and groups them by ${Object.values(RK).map(esc).join(', ').replace(/, ([^,]*)$/, ' or $1') || 'creature, friendship, weather, place or day'}. A reel plays as a slow pan and zoom over each memory scene, with crossfades, captions in the creature's own voice (“Crawly 11 stole “as” from me. Rude.”), and the mood of each moment as the coloured progress bar. Soft music is there if you want it (♪, off by default).</p><p>Find them under 🎞 in the world's top bar (newest first), on a creature's card (its own reels), or in the small notice that says a new one is ready (a few a day at most). Reels keep copies of their memories, so they play the same after the diary has moved on; ☆ keeps one for good, and reels go along in snapshots.</p><p><b>Replays.</b> Most memories also keep a short <b>recording</b> of the moment: where every creature nearby walked, the words and things around it, and the world as it was then: the <b>weather</b> with its own settings (amount, speed, size, slant, glyphs…), the <b>time of day</b> with its light, the <b>ground features</b> within reach, and the <b>solid objects and buildings</b> nearby. A reel plays recordings where it has them and pictures where it doesn't; the list says which: <b>▶ clips</b>, <b>▢ pics</b> or <b>◐ mixed</b>. Clips recorded before the world was kept with them play with the weather of today. On phones replays keep the light, ground and objects and leave out the rain and snow.</p>`; }
  { // 🎃 Halloween (Oct 31, 2026): its facts are read from idle-halloween.js
    let hs = ''; try { hs = await (await fetch('idle-halloween.js', { cache: 'no-store' })).text(); } catch (e) {}
    const cos = ((hs.match(/const COSTUMES = \[([^\]]*)\]/) || [])[1] || '').match(/'[^']+'/g) || [], cap = (hs.match(/PK_MAX = (\d+)/) || [])[1];
    const CN = { sheet: 'a ghost sheet with two eye holes', hat: 'a witch hat', wings: 'bat wings that flap as it walks', bones: 'a skeleton (ribs and a skull)', pumpkin: 'a carved pumpkin head with a flickering light', cape: 'a cape that swings' };
    h += sec('halloween', '🎃 Halloween', 3) + `<p>On Halloween night the world dresses up. It turns on by itself on <b>October 31</b> (all day, until 6 am on November 1), or any day with <a href="arena.html?halloween" target="idle-arena"><code>?halloween</code></a> at the end of the address (a link you can share), or with the <b>🎃 Halloween</b> switch in ⚙ settings and in the studio's header. The same switches turn it off. It is a <b>mode</b>: nothing in your world is changed, and when it ends everything looks as it did.</p>
<p><b>The night.</b> A moonlit purple sky over the floor, a big moon in the corner and a low fog drifting near the bottom (in Gloamhold, the 1-bit keep, only the moon and the bats, in black and white).</p>
<p><b>Costumes.</b> Every creature picks one for the night and keeps it until morning${cos.length ? `: ${cos.map(c => CN[c.replace(/'/g, '')] || c).join(', ')}` : ''}. Some families lean towards certain costumes (by body: chips like wings and hats, orbs like pumpkins and sheets). Shy creatures wear theirs faintly, so they still blend in. Zoomed far out, costumes are not drawn (too small to see).</p>
<p><b>Jack-o'-lanterns.</b> About one word in eight turns into a glowing orange pumpkin with two carved eyes${cap ? `, ${cap} at most` : ''}. The same words every time, because it is chosen by the word itself.</p>
<p><b>Bats and ghosts.</b> Every half minute or so a flock of bats crosses the sky. Now and then the ghost of a creature you have put to rest drifts across the screen, translucent, and fades away; the haunted music notices it (see <a href="#haunted-music">haunted music</a>). Phones running in light quality skip the bats.</p>
<p><b>The Oracle</b> greets the night in the chat (IRC), and the first time the mode turns on in a browser a notice says how to turn it off.</p>`;
  }
  h += sec('music', 'Music and the DJ deck', 3) + pic('rave', 'the DJ deck during a rave') + `<p>The world makes its own music, live in the browser: no recordings, every note generated as it plays. Open it from 🎧 in the top bar.</p><p><b>One switch for all sound.</b> The 🔊 at the top right mutes and unmutes everything at once: creature sounds, weather, the background music, the deck and the soundtracks of memory reels. Hover it (or press the small ▾ next to it; on a phone, <i>volume</i> in the ☰ menu) for the rest: one <b>master volume</b>, an on/off switch and levels for <b>creatures and weather</b> (footsteps, voices, snips, thunder, rain, wind), and which <b>music</b> plays. Muted, the sound engine is paused, so it costs nothing. Your choice is remembered in this browser. Pressing play while everything is muted turns the sound back on, and says so.</p><p><b>One music at a time:</b> <i>off</i>, <i>background</i> or <i>deck</i>, the same switch at the top of the 🎧 panel and in the 🔊 popover. While the deck plays, the background music rests, and it comes back when you stop the deck.</p><p><b>Music steps back for reels.</b> While a memory reel plays, the music drops to about a fifth of its volume and comes back when the reel closes. A rave is the exception: the creatures are dancing to it, so it keeps playing at full volume.</p><p><b>Background music</b> is off until you turn it on, and it follows the world. Home is warm and plucky: soft pentatonic plucks over a slow pad. Gloamhold is low and old: a drone on the root and fifth, slow bells, now and then a high chime. Rain softens and muffles it, a storm adds a low pulse on the beat, fog slows it down, wind breathes underneath, and at night it gets sparser and lower. A few things leave a mark: a chime when a creature gets a name, a rumble for a volcano, a cheeky bass stab when someone goes hangry, a little sting when a new memory reel is ready.</p><p>The <b>DJ deck</b> is a small groove box: tempo (50–160), key and scale, a 16-step grid for kick, snare, hat, clap and bass, with presets (${PRESETS.length ? PRESETS.join(', ') : 'house, techno, breakbeat, halftime, boom bap, ambient'}), a mixer for bass, lead and pad where each has a soft ↔ gritty knob, a filter, echo, bitcrush, and <b>DROP</b>: two bars of build-up, a beat of silence, then everything slams back in. While the deck plays it takes over from the background music, which fades back when you stop. Lights follow the beat: a floor pulse, sweeping spotlights at Home and an optional strobe (at most four flashes a second; in Gloamhold it flips the keep black for white; off when your system asks for reduced motion). Decks can be saved as <b>sets</b>, kept in the browser and in snapshots.</p><p><b>On/off switches</b> sit beside each mixer channel (bass, lead, pad) and each effect (filter, echo, bitcrush). Off takes it out of the sound but keeps its level or setting, so switching it back on brings back exactly what you had: handy for dropping the bass out for a few bars, or comparing with and without the echo.</p><p><b>Base tune.</b> Switch on <i>base tune</i> in the deck and it plays the background music as it is set (its style, variation and voices) underneath your parts, at the deck's tempo and in the deck's key and scale. Your bass, lead and pad follow the base tune's chords, and the grid's drums play on top, so the two fit together instead of fighting. Tweaking the background music changes the base tune too. Switch it off to go back to the deck on its own.</p><p>The background music can be <b>tweaked</b> too. Pick a <b>style</b>: ${MSTYLES.length ? MSTYLES.join(', ') : 'follows the world, Home, Gloamhold, calm, dreamy, chiptune, gloomy or lo-fi'} (follows the world is the default: Home or Gloamhold, whichever you're in; lo-fi has swung drums and a little vinyl crackle). <b>↻ new variation</b> reshuffles its chords, rhythm and register. Under <i>tweak</i>: speed, key and scale, busyness, brightness, a level for each voice (pluck, pad, bells, drone, beat: the middle is the style as written, past the middle adds the voice even where the style has none), and whether it follows the weather and the day. A change lets the long notes go and starts the new music on its first chord, with a short dip instead of a click.</p><p>A tweak can be saved as a <b>track</b> (🌙 in the sets list): play it later as the background, or load it into the deck, where the filter, echo, crush, DROP and lights work on it, the grid's drums can play on top, and rave mode hears it (each style has its own tempo and its own mix of drums, bass and melody, so a chiptune track gets a different crowd from a gloomy one). The <b>set list</b> plays sets and tracks in order on the deck, a few minutes each, crossfading from one to the next, and loops; it goes along in snapshots.</p><p id="haunted-music"><b>🎃 Haunted music (Halloween).</b> While the Halloween mode is on, <i>follows the world</i> plays the <b>haunted</b> style instead of Home or Gloamhold (pick any other style and it stays yours; when the mode ends, following the world goes back to normal). It turns round a slow minor progression with a diminished chord in it, played by a wobbly <b>theremin</b> (a pure tone that holds a note, glides to the next and trembles more the longer it holds), a low organ drone, a sparse music box and bells, and now and then a heavy thump somewhere far away. The deck has a <b>haunted</b> preset too: a slow heartbeat in harmonic minor. With creature sounds on, the night has an <b>owl</b>, a creature knocking at a door gets three knocks and a creaking door, and a passing ghost lets out a soft <i>ooo</i>. Like all the music, every sound is generated live; nothing is recorded.</p><p>With <b>🕺 rave</b> on, the creatures react to it: see <a href="#rave">rave mode</a>.</p>`;
  h += sec('rave', 'Rave mode', 3) + `<p>Turn on <b>🕺 rave</b> in the deck and press play: the creatures near you hear it, and each one reacts by its own <b>taste in music</b>, a set of genes that evolve like the rest: a favourite tempo, how loud it can take it, and how much it listens for drums, bass and melody (the card shows it: "likes ~128 bpm, mostly bass").</p><p>Those who like it <b>dance on the beat</b>, each body its own way: chips bob, triangles and stars spin a quarter turn on each kick, orbs bounce, long-legged ones high-step, the rest sway. Friends who both dance form <b>conga lines</b> behind each other; when the bass is heavy, the bass lovers gather into a <b>mosh</b> knot. Those who don't like it cover their ears and walk away; timid ones hide from the strobe; hangry ones keep eating; sleepers grumble and roll over, or wake up if it's loud.</p><p>The deck's <b>dancefloor meter</b> counts who's dancing, bored and leaving, and says what this crowd wants (faster, slower, more bass, quieter…). Dancing lifts their mood, hating it stresses them, and it all goes into their diaries and favourite sets; a rave becomes a reel: <i>the night of the rave</i>.</p>`;
  h += sec('advisor', 'The advisor', 3) + pic('advisor', 'the advisor panel') + `<p>📊 in the top bar opens the <b>advisor</b>: how the creatures of the world you're in are doing, with a bar, a trend arrow (last minute) and a 10-minute line for each gauge: <b>fear</b> (hiding or afraid), <b>hunger</b>, <b>hurt</b>, <b>tiredness</b>, <b>crowding</b> (four or more neighbours within a step), <b>food supply</b> (what's on the floor for each diet, against how many eat it), <b>mood</b>, <b>friendships</b>, and the <b>dancefloor</b> while a rave is on.</p><p>When a gauge crosses a line it becomes an <b>issue</b>: what's wrong, why in plain words ("27 of 42 are hiding: packet storm for 40 min"), and one-click fixes that use the world's own verbs: calm the weather, stop the music, scatter food for the hungriest diet, let the scared, hurt or tired ones nap, put three to rest, throw a rave. Most can be undone. Issues clear only when things are clearly better, so they don't flicker on and off.</p><p>News about all of this comes in the <a href="#gazette">Id|le gazette</a>.</p>`;
  h += sec('gazette', 'The Id|le gazette and notices', 3) + `<p>The <b>Id|le gazette</b> brings news in a small pill, at most one every couple of minutes: firsts (the first hangry, the first theft, the first chart), records (the longest conga, the biggest count), disasters, food shortages. Items with a place have a <b>go ›</b>. Alerts can be <b>on</b>, <b>quiet</b> (only a red dot on 📊) or <b>off</b>; records and firsts are kept in snapshots.</p><p>Every notice the game shows comes in the same place: <b>pills</b> stacked at the bottom left, newest on top, at most three at a time (the rest wait their turn). Hovering holds one; the same message twice in a short while counts up instead of repeating. Each kind has its own icon${NTF ? `: ${esc(NTF)}` : ''}. Creature names in a notice are <b>mentions</b>: hover for a small card, click to go there.</p><p>Nothing is lost if a pill slips by: <b>🔔</b> keeps the last 50 as a history, and a Gazette clipping can be kept in <a href="#drawer">your drawer</a>.</p>`;
  h += sec('studio', 'The studio', 3) + `<p><b>🎛 studio</b> in the top bar is where the world itself is changed (🌦 <b>evolve</b> opens it at Evolve). At the top, <b>feed the world</b>: paste text, a web address or a few words, and they land on the floor as food and ground. Below it a grid of strips${STRIPS.length ? `: ${STRIPS.map(s => '<b>' + esc(s) + '</b>').join(', ')}, and <b>Objects</b>` : ''}:</p><ul><li><b>Evolve</b>: choose what may change (the <b>environment</b>: weather and its settings, day, ground, text look; the <b>objects</b>; the <b>creatures</b>), then evolve one step or a bigger jump. Undo goes back.</li><li><b>Weather</b>: pick a weather and shape it with its own faders. Every weather keeps its own settings (see <a href="#weather">Weather</a> for each one's), and changing a fader never reseeds the weather you're looking at.</li><li><b>Day</b>: turn the day cycle on and set its length. <b>Ground</b>: reshuffle the <a href="#ground">ground features</a>. <b>Disasters</b>: start one, or let them come <i>now and then</i>.</li><li><b>Text look</b> restyles the words where they lie; <b>Layout</b> is the only control that lays the text out again.</li><li><b>Sound</b>, <b>Children</b> (on or off, and the population cap) and <b>Objects</b> (add crates, bricks, boulders and racks).</li></ul><p>At the bottom, <b>saves</b>: snapshots, and <b>♥ keep this environment</b>, which adds the weather, day, ground and text look to a list of kept worlds you can go back to. Everything in the studio is kept per world: Home and Gloamhold each have their own.</p>`;
  h += sec('drawer', 'Your drawer', 3) + pic('drawer', 'the drawer with kept charts and a portrait') + `<p>Anything you like can be <b>kept</b>: a chart, a design, a picture or a page piece, a word, a creature's <b>portrait</b> (its name, body, a few genes, how it felt and the last lines of its diary), a <b>reel</b> with its replays, a <b>building</b> (a picture of it, its name and who built it), or a <b>Gazette</b> clipping. Keeping makes a <b>copy</b>: the original stays in the world, where creatures can still eat it, break it into code or rework it. The copy is yours.</p><p>Ways in: right-click a thing and choose <b>🗄 keep a copy</b>, hover a chart or picture for the small <b>🗄 keep</b> button, <b>🗄 portrait</b> on a creature's card, <b>🗄</b> in the reel player, <b>🗄 keep</b> on a building's menu, and <b>🗄</b> on a Gazette pill or in the 🔔 history.</p><p>The <b>🗄 drawer</b> in the top bar shows everything by kind, and in <b>collections</b> you name yourself (+ collection, then drag things onto it). Open one to look at it large, rename it, add a note, <b>place a copy back in the world</b> (in the middle of your view), play a kept reel, or <b>export</b> it (PNG for anything visual, SVG for charts, text for words and clippings, JSON for everything). Removing asks nothing and can be undone; removed things wait under <b>removed</b> and can be put back.</p><p>The drawer is yours, not a world's: it is the same in Home, Gloamhold and any page you visit. It lives in this browser (IndexedDB) and rides along in every snapshot, merging in without ever losing anything. When a creature's work is kept it notices: it feels looked after, writes it in its diary, and a kept chart counts like a pin for its tastes.</p>`;
  h += sec('datalab', 'The data lab', 3) + `<p><b>🧪 data lab</b> is a place where the creatures are <b>classifiers</b>: small models that read a message and give it a label. A stream of messages comes in (${DL ? DL + ', ' : ''}written for the game: support requests, spam, banking, chit-chat, angry and happy notes, a few in other languages; no real people's messages), and a <b>team</b> sorts it as it flows past, each member in a role: a <b>filter</b> pulls out what matches its label, a <b>router</b> sends each message to a bin, a <b>tagger</b> marks a mood or topic.${TEAM.length ? ` The starting team: ${TEAM.map(t => `<b>${esc(t.name)}</b> (${esc(t.role === 'route' ? 'router' : t.role === 'tag' ? 'tagger' : t.role)}, <code>${esc(t.head)}</code>)`).join(', ')}.` : ''} <b>edit team</b> swaps members for any of the classifiers on offer, sets their thresholds and renames them.</p><p>The classifiers are <a href="https://github.com/nicobrenner/jeffy" target="_blank" rel="noopener">Jeffy</a> heads. <b>The starting team runs in your browser</b>${JHEADS.length ? ` (${JHEADS.map(h => '<code>' + esc(h) + '</code>').join(', ')})` : ''}: the first time a lab opens it fetches a small text encoder (all-MiniLM-L6-v2, int8, Apache-2.0) and the three heads, 23.7 MB in all, once; the browser keeps them, and from then on each message is labelled in a few milliseconds and <b>nothing is sent anywhere</b>. Opening the game never fetches them, only the lab (or a sorter or debugger once they're here). These three were refitted for the small encoder: spam and support tickets are as accurate as the server's versions (99.2% and 99.8%), the mood tagger is a little less (62.6% against 66.3% on a hard three-way task). Because the browser's arithmetic differs slightly from the server's, a borderline message can land on the other side of a "sure" threshold.</p><p>Any <b>other</b> head you pick in edit team is asked on Jeffy's public server (through the helper, on id-le.com: only the message text goes there) or, at home, on a Jeffy server on your own computer. If that server is busy, the stages that need it wait a few seconds; if it doesn't answer, they try again every 30 seconds. When safe mode is on after a crash, the in-browser classifiers stay off and everything goes to the server.</p><p><b>Order matters.</b> A router sends <i>every</i> message to a bin (a sure label, or <b>review</b> when it isn't sure), so a stage placed after a router never gets one: put filters and taggers before it. When the team is stuck, the team panel says why in one line (⚠ stuck), and the same line comes once as a notice: a stage that can never get a message, a busy or silent server, or messages waiting that nobody picks up.</p>`;
  h += `<p><b>A walkthrough.</b> The first time you open a lab, a short walkthrough${DLW ? ` (${DLW} steps)` : ''} appears at the top of the team panel: what the lab is, one message travelling from the inbox to a bin, the three kinds of stage and their <b>sure at ≥</b> bars (with a button that lowers the router's bar, so you can watch more messages get routed automatically and fewer go to review), changing the team, the <b>review</b> bin, the team stats, and where the classifiers run. Steps tick off when you do the thing; <b>show me ›</b> takes you there (on a phone it folds the panel away so you can see the floor), <b>end</b> stops it, and <b>? walkthrough</b> in the panel's header starts it again.</p>`;
  h += sec('connect', 'Connecting worlds', 3) + `<p><b>🌐 connect</b> links your world to other people's. Every world has a short <b>code</b> and a name you can change; give your code to a friend, they enter it, and the link waits for your <b>approve</b>. Linked worlds show up as <b>portals</b> in yours, marked when the other world is open somewhere.</p><p>Curious creatures wander through a portal now and then, and you can send one on purpose: it turns up in the other world as a <b>guest</b>, lives there for a while, and comes home with a <b>souvenir</b> (a word it picked up); if nobody sends it back it finds its own way home after a quarter of an hour. You can also <b>watch</b> a linked world: a small live map of its creatures and words, updated about once a minute. Links go through the same helper that reads web pages for the creatures (on id-le.com, the <a href="#settings">public helper</a> switch); without it, worlds can't be linked.</p>`;
  h += sec('evolution', 'Evolution', 3) + `<p>Creatures evolve: a mutation copies a genome with small changes, and you choose what to keep. The world evolves too (layout, tilt, weather, ground, fonts), from the 🌦 evolve button, and you can keep worlds you like.</p>`;
  h += sec('first5', 'The first five minutes', 3) + `<p>A browser that has never kept a world doesn't start on an empty floor: it arrives in <b>a small world</b> that is already living (a dozen creatures mid-day: one asleep, one hungry, two friends, a Mathematician with charts out, a Counter, a Designer and an Architect with a pile of crates, words on the floor and a lake). A short <b>trail of tips</b> arrives as 🧭 pills, one at a time, each with <b>show me ›</b>: open a card, name someone, feed the hungry one, watch the sleeper dream, follow a Gazette pill, try another weather, play the first reel, keep something in the drawer. Each tip counts as done however you get there, <b>I'll explore</b> ends them for good, and the ring on 🔔 shows how far along you are. Early on the world asks for <b>a name</b>; after about ten minutes it suggests <b>saving a backup file</b>, because a world kept in browser storage is gone if the browser's data is cleared. When each of those firsts happened stays in your browser (the almanac shows it); nothing is sent anywhere. A world you already have never sees any of this.</p>`;
  h += sec('make', 'Make it yours'); h += `<p class="hat">The starting world is only a start. Everything in it can be reshaped, and the whole game is open source.</p>`;
  h += sec('remix', 'Remix a world', 3) + `<p>Every world can be pulled in a new direction from inside the game: <a href="#evolution">evolve</a> the creatures (mutate, a bigger jump, or design one from scratch in the creatures sidebar's designer, and ♥ keep the ones you like as blueprints), evolve the world from the <a href="#studio">studio</a> (weather and its faders, day, ground, text look, layout, objects), feed it text and web pages, let Architects build, and travel to <a href="#gloamhold">Gloamhold</a> or a captured page. Keep what you like: ♥ kept worlds, 📸 snapshots, and a <a href="#snapshots">world file</a> you can download, load somewhere else or give to someone, who then has your world, creatures, diaries and all.</p>`;
  h += sec('your-ai', 'With your own AI', 3) + `<p>The <b>${esc(NM.op.icon + ' ' + NM.op.short)}</b> (its button sits at the world's edge; on phones it's in ☰) talks to an AI <b>you</b> bring: your own API key (Anthropic, or any OpenAI-compatible provider) or a model running on your own computer (Ollama, LM Studio). The key stays in this browser and goes only to the provider you picked; it is never in snapshots or world files. The AI sees a summary of the world around you and acts through the game's own verbs${TOOLS.length ? `: ${TOOLS.map(t => '<code>' + esc(t) + '</code>').join(', ')}` : ''}. Every action shows in the chat, and the bigger ones ask you first. So you can ask it for a storm over the Counters, a new Architect, a world evolved toward the night, or a creature that says something in character.</p><p>The AI changes the <b>world</b>, not the game: it can't rewrite how Id|le works. For that, get the code (below) and use any AI you like on it. Letting players change the game itself from inside it (mods kept in world files, small scripts with a narrow API, an in-browser copy of the code) is an <b>idea</b> on the roadmap, not built.</p>`;
  h += sec('the-code', 'Get the code', 3) + `<p>Id|le is <b>open source</b> under the MIT license: <a href="https://github.com/nicobrenner/id-le" target="_blank" rel="noopener">github.com/nicobrenner/id-le</a> is the whole game, the same files id-le.com runs. Fork it, change anything, and run your own version:</p><ul><li><b>On your computer:</b> <code>python3 demo_server.py 8765</code>, then open <code>http://localhost:8765/arena.html</code>.</li><li><b>As a website:</b> <code>python3 tools/build_static.py --out dist</code> makes a folder of plain files; id-le.com is that folder on Cloudflare Pages, with the optional helper (<code>helper/worker.js</code>: reading web pages for the creatures, linking worlds) in the same project. <code>docs/deploy.md</code> has the steps.</li></ul><p>The game is plain HTML and JavaScript with nothing to compile: <code>demo/arena.html</code> is the world, and each feature lives in its own <code>idle-*.js</code> module. The <a href="https://github.com/nicobrenner/id-le/blob/main/docs/devlog.md" target="_blank" rel="noopener">devlog</a> explains how things work and what was measured; the <a href="https://github.com/nicobrenner/id-le/issues/20" target="_blank" rel="noopener">roadmap</a> shows what's coming. Issues and pull requests are welcome.</p>`;
  h += sec('snapshots', 'Snapshots and saving'); h += `<p>Everything in a world can be kept: 📸 <b>snapshot</b> saves the creatures (with their genomes, lives, diaries, friends and ledgers), the residents and the resting, the namers, the world and its weather, the words, and any captured page. The world also autosaves as you play, and snapshots are mirrored to disk. Restoring or leaving never throws anything away: the old state goes into the snapshot list first.</p><p><b>World files.</b> On id-le.com your world lives in this browser, so the snapshot panel also has <b>⬇ download my world</b>: one JSON file with everything (every setting, the autosave and all snapshots). <b>⬆ load a world file</b> brings one back, in this browser or another; the world you had goes into the backups first, and snapshots merge rather than replace. A world file is also how you hand a world to someone else. A single snapshot can be downloaded on its own too.</p>`;
  h += `<p><b>Nothing you type is lost to a reload.</b> Whatever is half-written in a chat box (${esc(NM.irc.short)}, the ${esc(NM.op.short)}, notes) is kept in this browser as you type and put back when the page loads again; it is forgotten once you send it. Plain one-line fields are left alone, because some of them hold AI keys.</p>`;
  h += sec('settings', 'Settings and privacy'); h += `<p><b>⚙ settings</b> has the few switches that are about you rather than the world: the <b>public helper</b> (on id-le.com it reads public web pages for Crawlers and travel, and links worlds; off, those features say so and stand still), <b>anonymous stats</b> (a few counts about how new players get on, such as whether the guided start was finished, where it stopped, a rough frame rate, roughly how long the page stayed on screen and the name of the site a link came from; only daily totals are kept; no world contents, no chat, no ID that follows you; never sent from a copy on your own computer), and <b>highlight creatures</b> (also H). Your world, drawer, almanac and AI key stay in this browser. The <a href="privacy.html">privacy page</a> says exactly what is kept and what is sent.</p>`;
  h += sec('about', 'About this encyclopedia'); h += `<p>The Id|le-pedia reads its facts straight from the world's own code when it opens (arena.html and the game's modules) (the families and their seed names, the jobs, genes, bodies, weathers, feelings and disasters), so it cannot fall behind it. The creatures in the boxes and in the margins are drawn by the world's own drawing code. What it shows of <i>your</i> world is read from this browser and never changed.</p>${missing.length ? `<p class="note">Could not read from the world this time: ${missing.map(esc).join(', ')}.</p>` : ''}`;
  const words = (auto.words || []).map(w => w.text || w.t || w).filter(w => typeof w === 'string' && w.length < 16);
  h += `<div class="floor" id="floor">${Array.from({ length: Math.min(40, words.length) }, () => `<span style="left:${(Math.random() * 94).toFixed(1)}%;top:${(Math.random() * 70).toFixed(0)}px;transform:rotate(${((Math.random() - .5) * 30).toFixed(0)}deg)">${esc(pick(words))}</span>`).join('')}</div>`;
  main.innerHTML = h;
  // replays playing in the page (Oct 31): real clips recorded in the starter world (pedia_clips.json), played with the world's own
  // player and drawing (idle-replay-player.js, idle-critdraw.js, idle-replay-env.js, idle-build.js). Each plays while on screen, pauses
  // off screen and loops; with reduced motion it shows one still frame of the moment.
  (async () => { let C; try { C = await (await fetch('pedia_clips.json', { cache: 'no-store' })).json(); } catch (e) { return; } if (!C || !C.clips) return;
    const load = f => new Promise(r => { const el = document.createElement('script'); el.src = f; el.onload = r; el.onerror = r; document.head.appendChild(el); });
    for (const f of ['idle-critdraw.js', 'idle-replay-env.js', 'idle-build.js', 'idle-replay-player.js']) if (!(f === 'idle-critdraw.js' && window.__critDraw)) await load(f);
    const RP = window.__replayPlayer; if (!RP || !window.__critDraw) return;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches, live = [];
    for (const [id, x] of Object.entries(C.place || {})) { const hd = document.getElementById(id), cl = C.clips[x.clip]; if (!hd || !cl) continue;
      const fig = document.createElement('figure'); fig.className = 'pic clip'; fig.innerHTML = `<canvas role="img" aria-label="${esc(x.cap)}"></canvas><figcaption>${esc(x.cap)}</figcaption>`; hd.after(fig);
      if (cl.env) Object.defineProperty(cl.env, 'bg', { get: () => isDark() ? '#1c1e24' : '#fbf9f3', configurable: true });   // the floor follows the page's theme
      const P = RP.make(fig.querySelector('canvas'), { dark: isDark, low: () => false }); live.push({ el: fig, P, cl, on: false, started: false }); }
    const play = (L, on) => { if (on === L.on) return; L.on = on; if (!on) { L.P.pause(true); return; } if (!L.started) { L.started = true; L.P.start(L.cl); if (still) { L.P.pause(true); L.P.seek(L.P.evT + 400); setTimeout(() => L.P.stop(), 300); } return; } if (!still) L.P.pause(false); };
    const io = new IntersectionObserver(es => { for (const e of es) { const L = live.find(x => x.el === e.target); if (L) play(L, e.isIntersecting); } }, { rootMargin: '80px' });
    live.forEach(L => io.observe(L.el));
    setInterval(() => { if (still) return; for (const L of live) if (L.on && L.started && L.P.t >= L.P.dur + 1200) L.P.start(L.cl); }, 400);   // loop, with a short hold on the last frame
  })();
  $('#toc').innerHTML = '<b>Contents</b>' + toc.map(([id, t, l]) => `<a class="${l > 2 ? 'sub' : ''}" href="#${id}">${t}</a>`).join('') + '<b>Elsewhere</b><a href="arena.html" target="idle-arena">the world</a>';
  $('#ql').innerHTML = toc.map(([, t]) => `<option value="${esc(t.replace(/<[^>]+>/g, ''))}">`).join('');
  $('#q').addEventListener('change', e => { const v = e.target.value.trim().toLowerCase(); if (!v) return; const hit = toc.find(([, t]) => t.toLowerCase() === v) || toc.find(([, t]) => t.toLowerCase().includes(v)); if (hit) { location.hash = hit[0]; return; }
    const el = [...main.querySelectorAll('p,td,li')].find(x => x.textContent.toLowerCase().includes(v)); if (el) { el.scrollIntoView({ block: 'center' }); el.animate([{ background: 'var(--hl)' }, { background: 'transparent' }], { duration: 2000 }); } else toast('nothing about “' + v + '” yet'); });
  const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); };
  const fillNames = f => { const el = document.getElementById('nx-' + f); if (el) el.innerHTML = sample(f, 5).map(x => `<i>${esc(x)}</i>`).join(' · ') || '<span class="note">—</span>'; };
  famKeys.forEach(fillNames); main.addEventListener('click', e => { const b = e.target.closest('.nx'); if (b) fillNames(b.dataset.fam); });
  // names stay in the pedia: a click opens the creature's profile here. Only its "open in arena" button touches the world,
  // and it brings the world tab to the front first (the pedia never drives a world tab you cannot see)
  const pop = document.createElement('div'); pop.id = 'pop'; document.body.appendChild(pop);
  const memHTML = x => { const t = document.createElement('template'); t.innerHTML = String(x || ''); let o = '';
    const walk = nd => { for (const k of nd.childNodes) { if (k.nodeType === 3) o += esc(k.textContent); else if (k.nodeType === 1) { if (k.matches('a.mn')) o += `<a href="#" data-go="${esc(k.dataset.n || k.textContent)}">${esc(k.textContent)}</a>`; else if (k.matches('a.mw')) o += `<i>${esc(k.textContent)}</i>`; else walk(k); } } };
    walk(t.content); return o; };
  const ago = t => { const m = (Date.now() - t) / 60000; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
  function profile(name, anchor) { const x = living.find(y => y.name === name) || resting.map(r => ({ name: r.name, g: r.genome || r.g || {}, life: r.life, fam: famOf(r.genome || r.g, null), rest: true })).find(y => y.name === name);
    if (!x) { toast(name + ' is not in your saved world'); return; }
    const lf = x.life || {}, fe = lf.fe || {}, d = (lf.diary || []).slice(-4).reverse(), fr = (lf.friends || []).slice(0, 5);
    const bars = [['afraid', fe.fear], ['hurt', fe.hurt], ['excited', fe.thrill]].filter(([, v]) => v > 0.05).map(([k, v]) => `${k}<span class="bar" style="width:${Math.round(Math.min(1, v) * 60)}px"></span>`).join(' &nbsp;');
    pop.innerHTML = `<div class="t">${esc(x.name)}<button title="close" data-x>×</button></div><svg viewBox="0 0 140 104"></svg>
      <div class="row"><span class="k">family</span> <a href="#fam-${x.fam}">${esc(FAMS[x.fam] || x.fam)}</a>${x.g.job ? ` · <span class="k">job</span> ${esc(x.g.job)}` : ''}${x.rest ? ' · resting' : ''}</div>
      ${lf.days ? `<div class="row"><span class="k">lived</span> ${lf.days} day${lf.days === 1 ? '' : 's'}</div>` : ''}
      ${bars ? `<div class="row"><span class="k">feels</span> ${bars}</div>` : ''}
      ${fr.length ? `<div class="row"><span class="k">friends</span> ${fr.map(f => `<a href="#" data-go="${esc(f)}">${esc(f)}</a>`).join(', ')}</div>` : ''}
      ${d.length ? `<div class="row k">remembers</div><ul>${d.map(m => `<li>${memHTML(m.x)}${(m.ws || []).length ? ' ' + m.ws.map(([w, k]) => `<i>“${esc(w)}”</i>${k > 1 ? ' ×' + k : ''}`).join(', ') : m.n > 1 ? ' ×' + m.n : ''} <span class="k">· ${ago(m.t)}</span></li>`).join('')}</ul>` : '<div class="row k">no memories saved yet</div>'}
      ${x.rest ? '' : `<button class="go" data-open="${esc(x.name)}">open in arena ↗</button><div class="hint">switches to your world tab and opens its card</div>`}`;
    if (draw) try { const c = creature(x.g, 1); c.x = 70; c.y = 54; c.heading = -0.4; draw.buildLegs(c); const sv = pop.querySelector('svg'); sv.innerHTML = draw.legsSVG(c) + draw.bodySVG(c, 0); } catch (e) {}
    const r = anchor.getBoundingClientRect(); pop.classList.add('on');
    try { const sv = pop.querySelector('svg'), b = sv.getBBox(); if (b.width) { const pad = 10, w = Math.max(b.width, b.height * 140 / 104) + pad * 2, h = w * 104 / 140; sv.setAttribute('viewBox', `${b.x + b.width / 2 - w / 2} ${b.y + b.height / 2 - h / 2} ${w} ${h}`); } } catch (e) {}   // fit the whole creature, legs included
    pop.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8)) + 'px';
    pop.style.top = (r.bottom + pop.offsetHeight + 8 > innerHeight ? Math.max(scrollY + 8, r.top + scrollY - pop.offsetHeight - 6) : r.bottom + scrollY + 6) + 'px'; }
  function openInArena(name) {   // a visible switch: name the tab that opened this page, then navigate and focus it by that name
    try { if (window.opener && !window.opener.closed && window.opener.location.pathname.endsWith('/arena.html')) window.opener.name = 'idle-arena'; } catch (e) {}
    const w = window.open('arena.html#c=' + encodeURIComponent(name), 'idle-arena'); if (!w) return; try { w.focus(); } catch (e) {}
    // an already-open world only changed its #hash (no reload), so tell that one tab, now in front, to go to the creature
    // (the same path as clicking a name in a memory there: fly to it, select it, open its card)
    try { if (w.document.readyState === 'complete' && w.__arena) { const m = w.document.createElement('a'); m.className = 'mn'; m.dataset.n = name; m.style.display = 'none';
      w.document.body.appendChild(m); m.click(); m.remove(); w.history.replaceState(null, '', w.location.pathname); } } catch (e) {} }
  document.addEventListener('click', e => { const a = e.target.closest('a[data-go]');
    if (a) { e.preventDefault(); profile(a.dataset.go, a); return; }
    const o = e.target.closest('[data-open]'); if (o) { openInArena(o.dataset.open); return; }
    if (e.target.closest('[data-x]') || !e.target.closest('#pop')) pop.classList.remove('on'); });
  addEventListener('keydown', e => { if (e.key === 'Escape') pop.classList.remove('on'); });
  if (!draw) return;
  // static minis for your world, live boxes for families
  for (const s of document.querySelectorAll('svg[data-mini]')) { try { const g = JSON.parse(s.dataset.mini), c = creature(g, 1); c.x = 70; c.y = 52; c.heading = -0.4; draw.buildLegs(c); s.innerHTML = draw.legsSVG(c) + draw.bodySVG(c, 0); } catch (e) {} }
  for (const s of document.querySelectorAll('svg.live[data-fam]')) liveBox(s, genomeOf(s.dataset.fam));
  { const s = document.querySelector('svg.live[data-bodies]'); if (s) { let i = 0; const L = liveBox(s, { ...DG.tok, body: BODIES[0] }); setInterval(() => { if (!L.vis) return; i = (i + 1) % BODIES.length; L.c.g = { ...L.c.g, body: BODIES[i], hue: (L.c.g.hue + 61) % 360 }; draw.buildLegs(L.c); }, 3200); } }
  const io = new IntersectionObserver(es => es.forEach(e => { const L = lives.find(x => x.svg === e.target); if (L) L.vis = e.isIntersecting; })); lives.forEach(L => io.observe(L.svg));
  // margin crawlers: a few small creatures from your world (or the families) walking the edges, sometimes across the text
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, crawlSvg = $('#crawl'), roamers = [];
  const pool = living.length ? living.map(x => x.g) : famKeys.map(genomeOf);
  for (let i = 0; i < (reduce ? 0 : 4); i++) { const g = pick(pool), c = creature(g, Math.max(Math.min(0.42, 22 / ((g.l1 + g.l2) || 50)), 7 / (g.bodyW || 15))), vw = () => innerWidth, vh = () => innerHeight;
    c.next = () => { const edge = Math.random(); if (edge < 0.12) return [Math.random() * vw(), Math.random() * vh()]; const left = Math.random() < 0.5, mx = Math.max(30, Math.min(160, (vw() - 1180) / 2 + 60)); return [left ? 12 + Math.random() * mx : vw() - 12 - Math.random() * mx, 20 + Math.random() * (vh() - 40)]; };
    const p = c.next(); c.x = c.tx = p[0]; c.y = c.ty = p[1]; draw.buildLegs(c); c.rest = 0; roamers.push(c); }
  let fr = 0;
  function tick(t) { requestAnimationFrame(tick); if (document.hidden || (++fr & 1)) return;
    for (const L of lives) if (L.vis) L.svg.innerHTML = stepC(L.c, t, L.W, L.H, 34);
    if (roamers.length) crawlSvg.innerHTML = roamers.map(c => `<g opacity=".8">${stepC(c, t, innerWidth, innerHeight, 20)}</g>`).join('');
    wxTick(t); }
  // weather in the header: your world's weather, lightly
  const cv = $('#wx'), cx = cv.getContext('2d'), wk = worldNow.weather || 'clear', parts = Array.from({ length: reduce ? 0 : 46 }, () => ({ x: Math.random(), y: Math.random(), s: 0.3 + Math.random() }));
  function wxTick() { const W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight; cx.clearRect(0, 0, W, H); const ink = isDark() ? '200,210,255' : '40,60,140';
    for (const p of parts) { if (wk === 'clear') break;
      if (wk === 'bitrain' || wk === 'storm') { p.y += 0.012 * p.s * (wk === 'storm' ? 2 : 1); if (p.y > 1) { p.y = 0; p.x = Math.random(); } cx.fillStyle = `rgba(${ink},${0.25 + 0.3 * p.s})`; cx.font = '10px ui-monospace,Menlo,monospace'; cx.fillText(p.s > 0.8 ? '1' : '0', p.x * W, p.y * H); }
      else if (wk === 'wind') { p.x += 0.004 * p.s; if (p.x > 1) { p.x = 0; p.y = Math.random(); } cx.strokeStyle = `rgba(${ink},.25)`; cx.beginPath(); cx.moveTo(p.x * W, p.y * H); cx.lineTo(p.x * W + 14 * p.s, p.y * H); cx.stroke(); }
      else if (wk === 'static') { if (Math.random() < 0.3) { cx.fillStyle = `rgba(${ink},.4)`; cx.fillRect(Math.random() * W, Math.random() * H, 2, 2); } }
      else if (wk === 'fog') { p.x += 0.0006 * p.s; if (p.x > 1.1) p.x = -0.1; const g = cx.createRadialGradient(p.x * W, p.y * H, 0, p.x * W, p.y * H, 40 * p.s); g.addColorStop(0, `rgba(${ink},.06)`); g.addColorStop(1, `rgba(${ink},0)`); cx.fillStyle = g; cx.fillRect(p.x * W - 50, p.y * H - 50, 100, 100); }
      else if (wk === 'hum') { cx.strokeStyle = `rgba(${ink},.12)`; cx.beginPath(); for (let x = 0; x < W; x += 6) cx.lineTo(x, H * p.y + Math.sin(x / 18 + performance.now() / 200 + p.s * 9) * 3); cx.stroke(); if (p.s > 0.5) break; } } }
  requestAnimationFrame(tick);
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
  window.__pedia = { missing, families: famKeys, living: living.length };
})();
</script>
