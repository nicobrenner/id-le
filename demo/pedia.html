<!doctype html>
<html lang="en">
<head>

<style>
:root{--bg:#fbfaf6;--paper:#ffffff;--ink:#202122;--mut:#62666d;--rule:#d8d6cf;--link:#3366cc;--visited:#795cb2;--box:#f6f5f1;--hl:#fff3c4;--cur:#2b5cff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141518;--paper:#1b1c20;--ink:#e6e3dc;--mut:#9da0a6;--rule:#34363c;--link:#8ab4ff;--visited:#c3a6ff;--box:#222328;--hl:#4a3f12;--cur:#8ab4ff}}
:root[data-theme="dark"]{--bg:#141518;--paper:#1b1c20;--ink:#e6e3dc;--mut:#9da0a6;--rule:#34363c;--link:#8ab4ff;--visited:#c3a6ff;--box:#222328;--hl:#4a3f12;--cur:#8ab4ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow-x:hidden}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{font-family:"Linux Libertine","Georgia","Times",serif;font-weight:400;line-height:1.25}
h1{font-size:2em;margin:.2em 0 .1em;border-bottom:1px solid var(--rule);padding-bottom:.15em}
h2{font-size:1.55em;margin:1.4em 0 .4em;border-bottom:1px solid var(--rule);padding-bottom:.1em;clear:both}
.famsec{display:flow-root;clear:both}
h3{font-size:1.2em;margin:1.1em 0 .3em;font-weight:700;font-family:inherit}
code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:.88em}
code{background:var(--box);padding:0 .25em;border-radius:3px}
#wx{position:absolute;left:0;top:0;width:100%;height:96px;pointer-events:none;opacity:.55}
header{position:relative;display:flex;align-items:center;gap:14px;padding:14px 22px 10px;border-bottom:1px solid var(--rule);background:var(--paper)}
.logo{font-family:Georgia,serif;font-size:28px;line-height:1;white-space:nowrap}
.logo .bar{display:inline-block;width:2px;height:.9em;background:var(--cur);vertical-align:-.08em;margin:0 1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tag{font-family:Georgia,serif;font-style:italic;color:var(--mut);font-size:13px}
header .sp{flex:1}
#q{font:inherit;padding:5px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink);width:min(260px,40vw)}
header button{font:inherit;font-size:13px;background:none;border:1px solid var(--rule);border-radius:3px;color:var(--ink);padding:4px 8px;cursor:pointer}
.wrap{display:flex;max-width:1180px;margin:0 auto}
nav{width:200px;flex:none;padding:18px 10px 40px 20px;font-size:13px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:auto}
nav b{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px;font-weight:600}
nav a{display:block;padding:1px 0}
nav a.sub{padding-left:12px;font-size:12.5px}
main{flex:1;min-width:0;background:var(--paper);border-left:1px solid var(--rule);padding:14px 28px 80px;position:relative}
.lede{color:var(--mut);font-size:13px;margin-bottom:10px}
.ib{float:right;clear:right;width:252px;margin:0 0 14px 18px;border:1px solid var(--rule);background:var(--box);font-size:13px;line-height:1.45}
.ib .t{text-align:center;font-weight:700;font-size:15px;padding:5px;font-family:Georgia,serif}
.ib svg.live{display:block;width:100%;height:160px;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer}
.ib .cap{text-align:center;color:var(--mut);font-size:12px;padding:2px 6px 4px}
.ib table{width:100%;border-collapse:collapse}
.ib th{text-align:left;vertical-align:top;padding:3px 6px;width:38%;font-weight:600}
.ib td{padding:3px 6px}
.ib .hd{background:var(--rule);text-align:center;font-weight:700}
.names{font-family:Georgia,serif}
.names i{white-space:nowrap}
.nx{font-size:12px;cursor:pointer;border:none;background:none;color:var(--link);padding:0 3px}
table.wt{border-collapse:collapse;margin:8px 0 14px;font-size:13.5px}
table.wt th,table.wt td{border:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
table.wt th{background:var(--box)}
.note{font-size:12.5px;color:var(--mut)}
.hat{font-style:italic;color:var(--mut);padding-left:1.6em;margin:-.2em 0 .6em;font-size:13.5px}
.feels span{display:inline-block;margin:0 10px 6px 0}
.yw{border:1px solid var(--rule);background:var(--box);padding:10px 14px;margin:8px 0 12px}
.yw .fam{margin:8px 0 2px;font-weight:600}
.yw .who{display:inline-flex;align-items:center;gap:2px;margin:0 10px 4px 0;font-size:13.5px}
.yw .who svg{width:34px;height:26px}
.yw small{color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
#toast.on{opacity:.92}
#pop{position:absolute;z-index:30;width:290px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px;line-height:1.45;padding:0 0 8px;display:none}
#pop.on{display:block}
#pop .t{font-family:Georgia,serif;font-weight:700;font-size:16px;padding:6px 10px 2px;display:flex;align-items:center;gap:6px}
#pop .t button{margin-left:auto;border:none;background:none;color:var(--mut);font-size:16px;cursor:pointer}
#pop svg{display:block;width:100%;height:110px;background:var(--box);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
#pop .row{padding:2px 10px}#pop .k{color:var(--mut)}
#pop .bar{display:inline-block;height:6px;background:var(--link);vertical-align:middle;margin-left:4px;border-radius:1px}
#pop ul{margin:2px 0 4px;padding:0 10px 0 26px}
#pop .go{display:block;margin:8px 10px 0;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--link);color:var(--link);background:none;border-radius:3px;cursor:pointer;text-align:center;width:calc(100% - 20px)}
#pop .go:hover{background:var(--link);color:var(--paper)}
#pop .hint{padding:2px 10px;color:var(--mut);font-size:11.5px;text-align:center}
#crawl{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
.floor{clear:both;margin-top:50px;border-top:1px dashed var(--rule);padding-top:10px;position:relative;height:90px;overflow:hidden}
.floor span{position:absolute;font-family:Georgia,serif;color:var(--mut);opacity:.55;white-space:nowrap;font-size:13px}
.err{border:1px solid #c33;padding:10px;background:var(--hl)}
mark{background:var(--hl);color:inherit}
@media (max-width:820px){nav{display:none}main{border-left:none;padding:12px 16px 60px}.ib{float:none;width:auto;margin:0 0 12px}header{flex-wrap:wrap;padding:12px 16px}.tag{display:none}#q{width:100%}}
@media (prefers-reduced-motion:reduce){.logo .bar{animation:none}}
svg.onebit{float:right;margin:0 0 8px 14px;border:1px solid #000;shape-rendering:crispEdges}
</style>
</head>
<body>
<header><canvas id="wx"></canvas>
  <a class="logo" href="#top" style="color:inherit;text-decoration:none">Id<span class="bar"></span>le<span style="font-size:.6em;color:var(--mut)">-pedia</span></a>
  <span class="tag">the encyclopedia of a small world, written while it happens</span>
  <span class="sp"></span>

  <button id="theme" title="light, dark or follow the system">◐ auto</button>
  <a href="arena.html" target="idle-arena" title="the world itself">→ the world</a>
  <a href="privacy.html" title="what Id|le keeps and sends" style="font-size:13px">privacy</a>
  <a href="https://github.com/nicobrenner/id-le" target="_blank" rel="noopener" title="Id|le is open source: read or change its code" style="font-size:13px">code</a>
</header>
<div class="wrap"><nav id="toc"></nav><main id="top"><p class="lede">Loading the world's own source to read the facts from…</p></main></div>
<svg id="crawl" aria-hidden="true"></svg>
<div id="toast"></div>
<script>
(async () => {
  const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pick = a => a[Math.floor(Math.random() * a.length)], main = $('main');
  // ---------- theme (its own key; the arena's storage is only ever read) ----------
  const TH = ['auto', 'light', 'dark']; let th = 'auto'; try { th = localStorage.getItem('pedia.theme') || 'auto'; } catch (e) {}
  const applyTh = () => { if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = th; $('#theme').textContent = { auto: '◐ auto', light: '☀ light', dark: '☾ dark' }[th]; };
  applyTh(); $('#theme').onclick = () => { th = TH[(TH.indexOf(th) + 1) % 3]; try { localStorage.setItem('pedia.theme', th); } catch (e) {} applyTh(); };
  const isDark = () => th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  // ---------- read the facts out of arena.html itself, so this page cannot drift from the world ----------
  let src; try { src = await (await fetch('arena.html', { cache: 'no-store' })).text(); } catch (e) {}
  if (!src) { main.innerHTML = '<p class="err">Could not read <code>arena.html</code>. Open this page from the same server as the world (http://localhost:8765/pedia.html).</p>'; return; }
  const code = [...src.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]).sort((a, b) => b.length - a.length)[0] || '';
  function endOf(s, i) {   // i is at an opening bracket; skips strings, templates and comments; returns the index after its match
    const st = []; let depth = 0;
    for (; i < s.length; i++) { const ch = s[i], top = st[st.length - 1];
      if (top === '`') { if (ch === '\\') { i++; continue; } if (ch === '`') st.pop(); else if (ch === '$' && s[i + 1] === '{') { st.push('${'); i++; } continue; }
      if (top === "'" || top === '"') { if (ch === '\\') { i++; continue; } if (ch === top) st.pop(); continue; }
      if (ch === '/' && s[i + 1] === '/') { i = s.indexOf('\n', i); if (i < 0) return -1; continue; }
      if (ch === '/' && s[i + 1] === '*') { i = s.indexOf('*/', i) + 1; continue; }
      if (ch === "'" || ch === '"' || ch === '`') { st.push(ch); continue; }
      if (ch === '{' || ch === '[' || ch === '(') { if (top === '${') st.push(ch); else depth++; continue; }
      if (ch === '}' || ch === ']' || ch === ')') { if (top === '${' && ch === '}') { st.pop(); continue; } if (st.length && (top === '{' || top === '[' || top === '(')) { st.pop(); continue; } if (--depth === 0) return i + 1; }
    } return -1; }
  const missing = [];
  function lit(name, within) { const s = within || code, m = new RegExp('\\b' + name + '\\s*=\\s*(?=[\\[{])').exec(s); if (!m) { missing.push(name); return null; }
    const a = m.index + m[0].length, b = endOf(s, a); try { return new Function('head', 'return (' + s.slice(a, b) + ')')(undefined); } catch (e) { missing.push(name); return null; } }
  function fnSrc(name) { const i = code.indexOf('function ' + name + '('); if (i < 0) { missing.push(name); return ''; } const b = code.indexOf('{', endOf(code, code.indexOf('(', i))); return code.slice(i, endOf(code, b)); }
  const DG = lit('DEFAULT_GENOMES') || {}, SEEDS = lit('NAME_SEEDS') || {}, FAMS = lit('NAME_FAMS') || {}, JOB_NAMES = lit('JOB_NAMES') || {}, JOBS = lit('JOBS') || [], ACTIONS = lit('ACTION_POOL') || [];
  const WN = lit('WEATHER_NAMES') || {}, WXS = lit('WX_SPEC') || {}, FEEL = lit('FEEL') || {}, SAY = lit('SAY') || {}, ONSET = lit('ONSET') || {}, DIS = lit('DIS') || {}, TRAITS = lit('TRAITS') || [], GLY = lit('GLY') || [];
  const spawn = fnSrc('spawnSpecial'), BASE = lit('base', spawn) || {}, SPECIAL = lit('G', spawn) || {}, mut = fnSrc('mutate'), CL = lit('CL', mut) || {};
  const BODIES = ((/pick\(\[('chip'[^\]]*)\]/.exec(mut) || [])[1] || '').match(/'(\w+)'/g)?.map(s => s.slice(1, -1)) || [];
  const KEEPW = lit('SEEDW') || [], ICONS = lit('ICON') || {}, KEEPROOMS = lit('KIND_NAMES') || {}, KEEPGENES = lit('GENES0') || {};
  const FEATS = [...new Set(((/pick\(\[('stream'[^\]]*)\]/.exec(fnSrc('genFeatures')) || [])[1] || '').match(/'(\w+)'/g)?.map(s => s.slice(1, -1)) || [])];
  // the creature drawing code, taken verbatim from the world (legs, inverse kinematics, gait, bodies)
  let draw = null; try { draw = new Function('pick', 'selected', ['sizeUp', 'restSpot', 'hip', 'knee', 'buildLegs', 'stepLegs', 'legsSVG', 'bodySVG'].map(fnSrc).join('\n') + '\nreturn { buildLegs, stepLegs, legsSVG, bodySVG };')(pick, null); } catch (e) { console.warn('pedia: drawing code', e); }
  // ---------- read-only view of your world (never written) ----------
  const ls = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const auto = ls('arena.autosave') || {}, liveG = ls('arena.genomes') || auto.genomes || {}, worldNow = ls('arena.world') || auto.world || {}, resting = ls('arena.resting') || auto.resting || [], namerSt = ls('arena.namers') || auto.namers || {};
  const famOf = (g, fam) => { g = g || {}; return SEEDS[g.job] && g.job !== 'crawly' && g.job !== 'tok' ? g.job : fam || (g.body === 'chip' ? 'crawly' : 'tok'); };
  const SPK = { crawl: 'crawler' }, genomeOf = fam => DG[fam] ? DG[fam] : SPECIAL[SPK[fam] || fam] ? { ...BASE, ...SPECIAL[SPK[fam] || fam] } : DG.tok;
  // ---------- a namer of our own (same idea as the world's: order-2 chain with backoff over the family's names) ----------
  function sample(fam, n) { const seeds = SEEDS[fam] || [], w = (namerSt[fam] && namerSt[fam].w) || Object.fromEntries(seeds.map(s => [s, 2])), T = {}; let lmin = 99, lmax = 0;
    for (const [nm, wt] of Object.entries(w)) { const s = '^^' + nm + '$'; lmin = Math.min(lmin, nm.length); lmax = Math.max(lmax, nm.length); for (let i = 2; i < s.length; i++) for (const k of [s.slice(i - 2, i), s[i - 1]]) { const t = T[k] = T[k] || {}; t[s[i]] = (t[s[i]] || 0) + wt; } }
    const draw1 = t => { let r = Math.random() * Object.values(t).reduce((a, b) => a + b, 0); for (const [c, v] of Object.entries(t)) if ((r -= v) <= 0) return c; return '$'; };
    const pipe = seeds.some(s => s.includes('|')), minL = Math.max(3, Math.min(...seeds.map(s => s.length))), out = new Set(), known = new Set(Object.keys(w));
    for (let k = 0; k < 600 && out.size < n; k++) { let s = '^^'; while (s.length < lmax + 4) { const t = Math.random() < 0.88 && T[s.slice(-2)] ? T[s.slice(-2)] : T[s.slice(-1)]; if (!t) break; const c = draw1(t); if (c === '$') break; s += c; }
      const nm = s.slice(2); if (nm.length < minL || nm.length > lmax + 2 || known.has(nm) || /(.)\1\1/i.test(nm) || nm.includes('|') !== pipe || (nm.match(/[|_]/g) || []).length > 1 || /^[|_]|[|_]$/.test(nm)) continue; out.add(nm); }
    return [...out]; }
  // ---------- live creatures ----------
  const lives = [];
  function creature(g, size) { const c = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, heading: Math.random() * 6.28, state: 'idle', held: false, phase: Math.random() * 10, g, size, nextFidget: 0, rest: 0 }; draw && draw.buildLegs(c); return c; }
  function stepC(c, t, W, H, pad) { const sp = (c.g.speed || 1) * (c.size || 1) * 0.7;
    if (c.state === 'sleep') { if (t > c.rest) c.state = 'idle'; } else { const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy); let vx = 0, vy = 0;
      if (d > 2) { const s = Math.min(sp, d); vx = dx / d * s; vy = dy / d * s; c.x += vx; c.y += vy; } else if (t > c.rest) { if (Math.random() < 0.06) { c.state = 'sleep'; c.rest = t + 4000; } else { c.rest = t + 600 + Math.random() * 2600; const p = c.next ? c.next() : [pad + Math.random() * (W - 2 * pad), pad + Math.random() * (H - 2 * pad)]; c.tx = p[0]; c.ty = p[1]; } }
      c.vx = c.vx * 0.8 + vx * 0.2; c.vy = c.vy * 0.8 + vy * 0.2; if (Math.hypot(c.vx, c.vy) > 0.15) { let a = Math.atan2(c.vy, c.vx) - c.heading; a = Math.atan2(Math.sin(a), Math.cos(a)); c.heading += a * 0.08; } }
    draw.stepLegs(c, t); return draw.legsSVG(c) + draw.bodySVG(c, t); }
  function liveBox(svg, g) { const W = 220, H = 160, R = (g.l1 + g.l2) || 50, size = Math.min(1, 46 / R); const c = creature(g, size); c.x = c.tx = W / 2; c.y = c.ty = H / 2; draw.buildLegs(c);
    const L = { svg, c, W, H, vis: false, last: 0 }; lives.push(L); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.addEventListener('click', () => { c.state = 'idle'; c.rest = 0; c.tx = 20 + Math.random() * (W - 40); c.ty = 20 + Math.random() * (H - 40); }); return L; }
  // ---------- the articles ----------
  const famKeys = Object.keys(FAMS).sort((a, b) => (b === 'crawly') - (a === 'crawly') || (b === 'tok') - (a === 'tok'));
  const JOB_EXTRA = { crawl: 'goes out on the real web and comes back with words in its legs' }, jobKey = f => genomeOf(f).job, n = x => Math.round(x * 100) / 100;
  const toc = [], sec = (id, title, lvl = 2) => { toc.push([id, title, lvl]); return `<h${lvl} id="${id}">${title}</h${lvl}>`; };
  const living = []; for (const k of ['crawly', 'tok']) if (liveG[k]) living.push({ fam: k, name: liveG[k].name || DG[k].name, g: liveG[k], life: ((auto.creatures || []).find(c => c.key === k) || {}).life, orig: true });
  for (const r of auto.residents || []) living.push({ fam: famOf(r.genome, r.key === 'crawly' || r.key === 'tok' ? r.key : null), name: r.name, g: r.genome, life: r.life });
  const byFam = {}; for (const x of living) (byFam[x.fam] = byFam[x.fam] || []).push(x);
  let h = `<h1>Id|le</h1><p class="lede">From the Id|le-pedia, the encyclopedia of the world it describes. ${living.length ? `Your world has <b>${living.length}</b> creatures out${resting.length ? ` and ${resting.length} resting` : ''}, in <b>${Object.keys(byFam).length}</b> families; the weather there is <b>${esc(WN[worldNow.weather] || worldNow.weather || 'unknown')}</b>.` : 'No world saved in this browser yet.'}</p>`;
  h += `<div class="ib"><div class="t">Id|le</div><svg class="live" data-fam="tok"></svg><div class="cap">Id|le, the first tokenizer (alive; click to send it somewhere)</div><table><tr><th>Kind</th><td>a world of word-eating creatures</td></tr><tr><th>Families</th><td>${famKeys.length}</td></tr><tr><th>Jobs</th><td>${JOBS.length}</td></tr><tr><th>Bodies</th><td>${BODIES.length}</td></tr><tr><th>Weathers</th><td>${Object.keys(WN).length}</td></tr><tr><th>Feelings</th><td>${Object.keys(FEEL).length}</td></tr></table></div>`;
  h += `<p><b>Id|le</b> (written with the bar, spelled <code>id-le</code> where a bar cannot go) is a small world whose ground is made of words. Creatures with legs walk on them, eat them, carry them, cut them into pieces, name them, count them and pile them up. Every creature has a genome that mutates, a job, drives that pick what it does next, feelings, a diary, friends, favourite weather and food, and a mind you can watch stream. The world has weather, a day, ground features, disasters and other places to visit.</p>
  <p>The name comes from the first tokenizer, <b>Id|le</b>: a tokenizer's names are split like tokens, and the bar is where the cut falls. The world page itself is still called the arena.</p>`;
  if (living.length) { h += sec('your-world', 'Your world'); h += `<p class="hat">Read from this browser's copy of the world when this page opened. Click a name for its profile here; the profile has a button that takes you to it in the world.</p><div class="yw">`;
    for (const f of famKeys.filter(f => byFam[f])) h += `<div class="fam"><a href="#fam-${f}">${esc(FAMS[f])}</a> <small>${byFam[f].length}</small></div>` + byFam[f].map(x => { const lf = x.life || {}, last = (lf.diary || []).slice(-1)[0], tip = [x.g.job ? 'job: ' + x.g.job : '', lf.days ? lf.days + ' days' : '', (lf.friends || []).length ? (lf.friends.length + ' friends') : '', last && last.k ? 'last memory: ' + last.k : ''].filter(Boolean).join(' · ');
      return `<span class="who" title="${esc(tip)}"><svg data-mini="${esc(JSON.stringify(x.g))}" viewBox="0 0 140 104"></svg><a href="arena.html#c=${encodeURIComponent(x.name)}" data-go="${esc(x.name)}">${esc(x.name)}</a></span>`; }).join('');
    h += `</div>`; }
  // families
  h += sec('families', 'Families'); h += `<p>Creatures belong to a family, and each family has its own <b>namer</b>: a tiny character model that has read every name in the family and makes new ones that sound like them. Two creatures of a family share a sound the way people from one town might. Ordinary creatures are Crawly kin (chip bodies) or Tok kin (everything else); a creature with a special job joins that job's family.</p>
  <p>How a namer works: it is an order-2 Markov chain over letters with a little order-1 backoff, so it mostly continues a name the way its family's names continue, with an occasional surprise. Every name it gives joins what it has read; a name <i>you</i> choose counts three times; old names slowly fade (the seed names never fully), so a family's style drifts over generations but stays recognisable. Names keep their family's shape: Tok kin always carry one bar, Debuggers one underscore, nobody gets three of a letter in a row.</p>
  <table class="wt"><tr><th>Family</th><th>Seed names</th><th>How they sound</th></tr>${famKeys.map(f => `<tr><td><a href="#fam-${f}">${esc(FAMS[f])}</a></td><td class="names">${(SEEDS[f] || []).slice(0, 6).map(esc).join(', ')}…</td><td>${esc({ crawly: 'small and skittery', tok: 'split like tokens, one bar', namer: 'wordy, label-like', blursort: 'smeared, image words', crawl: 'vowels dropped, like old web tools', debug: 'underscored, hex-ish', counter: 'numbers and arithmetic', math: 'formula-ish, Greek-ish, curvy', designer: 'soft, crafty, like tools and type', sorter: 'shelves, piles and ranks' }[f] || '')}</td></tr>`).join('')}</table>`;
  for (const f of famKeys) { const g = genomeOf(f), j = g.job, mine = byFam[f] || [];
    h += '<section class="famsec">' + sec('fam-' + f, esc(FAMS[f]), 3);

      <tr><th>Job</th><td>${esc(j)}</td></tr><tr><th>Can</th><td>${esc((g.actions || []).join(', '))}</td></tr>${f === 'crawly' || f === 'tok' ? '' : `<tr><th>Hatched</th><td>workshop → special creatures</td></tr>`}
      <tr><td class="hd" colspan="2">Names</td></tr><tr><td colspan="2" class="names">${(SEEDS[f] || []).map(esc).join(' · ')}</td></tr>

    h += `<p><b>${esc(FAMS[f])}</b>${f === 'crawly' ? ', the family of Crawly (also called Moundy), the first crawler: eight legs, an abdomen, feelers and a targeting laser; it hoards words into a mound at home.' : f === 'tok' ? ', the family of Id|le, the first tokenizer: a box with six short legs that cuts words into pieces and collects vowels. Tok kin names are split like tokens.' : `: each one ${esc(JOB_NAMES[j] || JOB_EXTRA[j] || j)}.`}</p>`;
    h += `<p>${mine.length ? `In your world: ${mine.slice(0, 14).map(x => `<a href="arena.html#c=${encodeURIComponent(x.name)}" data-go="${esc(x.name)}">${esc(x.name)}</a>`).join(', ')}${mine.length > 14 ? ` and ${mine.length - 14} more` : ''}.` : '<span class="note">None in your world right now.</span>'}</p>`;
    if (f === 'counter') h += `<p>A Counter walks to a spot and counts the words, letters or creatures within reach, a small number popping over each, then drops the total on the floor as a number word. Later it carries two number words together and combines them with +, − or ×. What it likes to count, how far it looks (${SPECIAL.counter ? SPECIAL.counter.cR : 130} by default) and which sums it prefers are genes. Its card keeps a ledger.</p><p>Every Counter also has a <b>pace</b> (some count slowly, some fast), a <b>scale</b> (small ones count letters and count in pairs, 2, 4, 6; big ones count wide stretches of floor by fives and tens and like multiplying) and a <b>voice</b>: plain ones just think the numbers, sing-song ones finish with a little counting rhyme of their own, storytellers with a tiny tale about what they counted (“40 words. one of them looked nervous”). The numbers run through their mind stream as they go. Single digits are snacks; bigger numbers are left on the floor for sums and charts.</p>`;
    if (f === 'math') h += `<p>A Mathematician is Counter kin that does something with the numbers. It carries two number words to a free spot, turns them into a formula and plots it there as a small <b>chart</b>, point by point: a line, a parabola, a wave, a growth curve, the primes, or a Fibonacci-ish sequence that starts from its two numbers. Which formulas it likes is a gene. Charts are kept like designs: creatures who love images come and look, you can pin, restyle or take one apart (its numbers go back on the floor). With fewer than two numbers around it counts first, which makes some. Charts don't last forever: an unpinned chart that has been on the floor for about 20 minutes of play becomes <b>grazing</b> for Counter kin, who nibble its data points off one by one (the curve gets sparser, each bite drops a number word) until it folds back into the numbers it was made from. Pin a chart to keep it. The card shows its ledger, the diary its charts, and charts join the “A day of counting” reels.</p><p><b>Chart kinds and tastes.</b> A chart is a <b>source</b> (a formula: line, parabola, wave, sine-cosine mix, S-curve, damped wave, random walk, piecewise curve, growth, primes, Fibonacci; random data; or <b>real data</b> read off the world: who lives here, what everyone is doing, word lengths, first letters, the mood lately) drawn as one of ten <b>kinds</b>: line, bar, scatter, area, step, pie, donut, radar, histogram, or bars-and-line, in one of eight <b>palettes</b> (mono, analog, complement, triad, neon, pastel, earth, ink), with one to three series. Each is a gene: favourite sources, kinds and palettes, how busy its charts are (series, gridlines) and how much it <b>experiments</b> (a kind it has never drawn, any palette, any source: sometimes a pie chart of a sine wave). <b>Tastes</b> grow on top of the genes: looking at other Mathematicians' charts, its own charts drawing a crowd, and you pinning one all make it like that kind, palette or source more. The card shows its favourites and what it has come to like; restyling a chart tries the next palette; the gazette reports the first of each kind.</p>`;
    if (f === 'designer') h += `<p>A Designer makes little interfaces on the floor out of borrowed pieces: a <b>card</b> (a picture, a title, a line and a button), a <b>gallery</b>, a <b>list</b>, a <b>dashboard</b> (number words left by Counters become its figures, with a small line chart) or a <b>form</b>. It crops a piece out of an image (the image stays where it was) and carries words over one at a time; the words become part of the design. You can take a design apart (the words go back on the floor and the image pieces fall out as tiles) or restyle it, and other Designers sometimes rework one, unless you pin it 📌 (pinned designs are left alone by every creature; you can still change them). Which kinds it likes, its style (soft, brutal, retro or glass) and how big it builds are genes. Its card keeps a portfolio.</p>`;

  // jobs

  <p>What a creature can be asked to do (its <b>actions</b>) comes from a smaller pool: ${ACTIONS.map(a => `<code>${esc(a)}</code>`).join(', ')}, plus greet. Up to four are in its genes.</p>`;

  <p>A creature is drawn from its genome every frame: legs placed with two-bone inverse kinematics, feet that plant and swing in alternating groups, a body that breathes, and an idle life of weight shifts and tapping feet. All of it mutates. When a genome mutates, each number is multiplied by a small random factor and kept in a creature-sized range; shapes and switches flip now and then.</p>
  <table class="wt"><tr><th>Gene</th><th>Meaning</th><th>Range</th></tr>${TRAITS.map(([k, lab]) => `<tr><td><code>${esc(k)}</code></td><td>${esc(lab)}</td><td class="note">${CL[k] ? CL[k].join(' – ') : k === 'legs' ? '4 – 12, in pairs' : k === 'body' ? BODIES.join(', ') : k === 'job' ? JOBS.length + ' jobs' : k.includes('ue') ? '0 – 360°' : ['wander', 'social', 'timid', 'imgLove'].includes(k) ? '0 – 1' : ''}</td></tr>`).join('')}</table>
  <h3 id="image-lovers">Image lovers</h3><p>Every creature has a gene for how much it loves images (<code>imgLove</code>; seeded from its id until it first mutates, highest in Designers and Blursorts). Image lovers go and look at pictures and finished designs and stand around them for a while, which settles their curiosity; a picture with a crowd pulls harder, so pictures draw little gallery openings. The card shows how many times a creature has looked at pictures.</p><p>They grow <b>favourite pictures</b>, the way they grow favourite foods: each picture has a signature from its average colour and brightness (<i>dark blue</i>, <i>bright yellow</i>, <i>mid grey</i>…), and time spent looking at one kind builds a taste for it. After about a minute of looking it starts to like that kind (a diary line), and from then on those pictures pull it harder and hold it longer. The card's <i>likes</i> line shows its top two.</p>
  <h3 id="mind-genes">Mind genes</h3><p>Three genes shape the mind stream. Until a creature first mutates they are seeded from its id, so every creature already thinks differently:</p>

  // life
  h += sec('life', 'Life'); h += `<p>Creatures have four <b>drives</b> (hungry, curious, tired, fond of you) that rise and fall with what happens; the highest need picks what they do next. Around the drives each creature keeps a life.</p>`;
  { const DT = lit('DIETS') || {}, WHO = { pieces: 'Crawly kin (and hoarders)', short: 'Tok kin and most specials', numbers: 'Counters', crumbs: 'Designers' };
    h += sec('food', 'Food', 3) + `<p>Every family eats something, and a creature forages only for its own food:</p><table class="wt"><tr><th>Who</th><th>Eats</th></tr>${Object.entries(DT).map(([k, d]) => `<tr><td>${esc(WHO[k] || k)}</td><td>${esc(d.what || k)}</td></tr>`).join('')}</table><p>Hunger rises over time, and much more slowly when none of its food is around. Eating makes it a little bigger and teaches it <b>favourite foods</b>; a word it dislikes is spat out. <b>Feed one yourself</b>: drag a word and drop it on a creature, and it eats it on the spot whatever it is (a hand-fed word that is not its usual food is a smaller meal). Hungry creatures steal more, and the robbed get hurt; hurt heals by itself, faster asleep and faster still with a friend close by.</p>`;

  h += sec('feelings', 'Feelings', 3) + `<p>Feelings are not stored; they are read from what a creature already has: its drives, scares, thefts, sickness, and the time since you last paid it attention. The card shows the strongest three; when one crosses a line it becomes a memory, and sometimes the creature says it out loud.</p><p class="feels">${Object.entries(FEEL).map(([k, e]) => `<span title="${esc((SAY[k] || []).join(' / '))}">${e} ${esc(k)}${ONSET[k] ? ` <small class="note">→ “${esc(ONSET[k])}”</small>` : ''}</span>`).join('')}</p><p class="note">Hover a feeling for what creatures say when it starts.</p>`;
  h += sec('diary', 'Diary and memories', 3) + `<p>Each creature keeps a diary of up to 80 memories: meals, jobs, thefts, trips, disasters, friends made, renames and what you did to it. Repeats within five minutes fold into one memory that keeps what it was about (“ate ox ×4”). Names and words in memories are links: hover a name for a mini profile, click it to fly there.</p><p><b>Memory scenes.</b> Click a memory on the card and it shows the moment as a small picture: the weather and place it happened in, who was close or mentioned, the words it was about, how it felt then, and an icon for the kind of memory (🌋 a disaster, 💞 a friend, 🍽️ a meal…). Each memory keeps that moment when it is written, so the same memory always looks the same; memories from before scenes were kept come out vague, in sepia.</p><p><b>Mood ribbon.</b> Once a minute a creature notes its strongest feeling; the card shows the last 90 minutes as a ribbon of colours, thicker where the feeling was stronger. Hover a strip for the time, the feeling and what it remembers from around then.</p>

  h += sec('mind', 'The mind', 3) + `<p>The <b>mind</b> tab on a creature's card shows what goes on inside it, three ways:</p><ul><li><b>stream</b>: the mind never stops. Characters pour in at the top left, wrap row after row and fall out at the bottom right. Events are the raw data; between them it keeps processing its drives, its position, its targets, in its own glyphs. Asleep, it dreams scrambled memories, and its memory scenes and remembered words drift through the stream, half there (the <b>dream view</b>). Sleepers have 💤 floating over them, and the creatures sidebar can show only the ones asleep (💤 asleep); <b>💤 dream</b> on one flies there and opens its card on the mind tab. It stops only when it dies.</li><li><b>thoughts</b>: first-person, newest first: what it sees, wants, feels, says, does and remembers.</li><li><b>tagged</b>: the same with a colour per kind and numbers and words highlighted.</li></ul><p>How fast it streams depends on its <a href="#mind-genes">mind genes</a> and its state: curious, excited or scared minds run fast; tired and sleeping ones slow.</p>`;

  h += sec('card', 'The creature card', 3) + `<p>Clicking a creature opens its <b>card</b> at the side of the world, away from the creature, with a line tying it to its creature wherever it walks. Drag the card by its header to put it anywhere (it remembers the spot); double-click the header to dock it beside the creature again. Four tabs, the mind first:</p><ul><li><b>mind</b>: the stream of what goes on inside it (see The mind).</li><li><b>profile</b>: name, body, job, food, feelings, mood ribbon, likes, genes and what it has done.</li><li><b>friends</b>: everyone it has spent ten minutes with, its reels, and the memories it shares with them.</li><li><b>memories</b>: what it remembers (click one to see the scene) and the whole diary.</li></ul><p>Along the bottom: 😤 hangry, mutate, ×3, revert, ♥ keep (saves its body plan as a blueprint in Designs), clone, and <b>rest</b>, which puts it away: it keeps its name, memories and friends, frees a place, and wakes again from the creatures sidebar.</p>`;
  h += sec('world', 'The world'); h += sec('weather', 'Weather', 3) + `<p>The world always has one weather, at some intensity. Creatures notice it: they spend time in each, learn which they like, and say so when it turns. Each weather has its own settings in the studio.</p><table class="wt"><tr><th>Weather</th><th>Settings</th></tr>${Object.entries(WN).map(([k, v]) => `<tr><td>${esc(v)}${k === worldNow.weather ? ' <small class="note">← now, in your world</small>' : ''}</td><td class="note">${(WXS[k] || []).map(s => esc(s[1])).join(', ') || '—'}</td></tr>`).join('')}</table><p>There is also a <b>day</b>: dawn, day, dusk, night and before dawn, with light to match. Creatures count the days they have lived through.</p>`;
  h += sec('ground', 'Ground features', 3) + `<p>Under the words the ground has features, made when a world is made and reshuffled when it evolves: ${FEATS.map(f => `<b>${esc(f)}</b>${{ stream: ' (a current that carries words and creatures along)', well: ' (a latency well: everything inside moves slowly)', hole: ' (a small hole)', cache: ' (a cache, a patch where things are kept)' }[f] || ''}`).join(', ')}.</p>`;
  h += sec('disasters', 'Disasters', 3) + `<p>From the studio you can bring ${Object.values(DIS).map(esc).join(', ').replace(/, ([^,]*)$/, ' or $1')}. Words fly, creatures are scared, and everyone present remembers it.</p>`;

    + `<p><b>It changes.</b> Evolving the world while you are in the keep (the studio's evolve, or ⟳ mutate) changes the keep itself: a room splits in two, a wall comes down, a crypt becomes a library, rooms are rearranged or get new floors, and the genes drift (undo puts it back). Reshuffle refurnishes every room. The grow buttons at the minimap work here too: each adds a new wing on that side, with rooms of its own.</p>`
    + `<p><b>Weather</b> is drawn in one bit: rain falls as streaks (and bit rain as tiny 0s and 1s) that splash and leave puddles which spread and later dry; in a storm lightning flips the stone black for white and the floor shakes with the thunder; static falls as snow; wind blows streaks across and sways banners, chains and torch flames; fog thickens; the hum shows as a pulsing grid. The creatures live through it as at home (they hide from lightning, like or dislike it).</p>`
    + `<p>The first visit lays a floor of ${KEEPW.length || 'about fifty'} night words (${KEEPW.slice(0, 10).map(w => '<i>' + esc(w) + '</i>').join(', ')}…). Like every place it keeps its own state: its plan, what the creatures eat, carry and build there stays there when you leave, it is in snapshots taken there, and the world at home is untouched. It is a one-off: the 1-bit look belongs to this place only, not (yet) a style any world can switch to.</p>`;
  h += sec('music', 'Music and the DJ deck', 3) + `<p>The world makes its own music, live in the browser: no recordings, every note generated as it plays. Open it from 🎧 in the top bar.</p><p><b>Background music</b> is off until you turn it on, and it follows the world. Home is warm and plucky: soft pentatonic plucks over a slow pad. Gloamhold is low and old: a drone on the root and fifth, slow bells, now and then a high chime. Rain softens and muffles it, a storm adds a low pulse on the beat, fog slows it down, wind breathes underneath, and at night it gets sparser and lower. A few things leave a mark: a chime when a creature gets a name, a rumble for a volcano, a cheeky bass stab when someone goes hangry, a little sting when a new memory reel is ready.</p><p>The <b>DJ deck</b> is a small groove box: tempo (70–160), key and scale, a 16-step grid for kick, snare, hat, clap and bass, with presets (house, techno, breakbeat, halftime, boom bap, ambient), a mixer for bass, lead and pad where each has a soft ↔ gritty knob, a filter, echo, bitcrush, and <b>DROP</b>: two bars of build-up, a beat of silence, then everything slams back in. While the deck plays it takes over from the background music, which fades back when you stop. Lights follow the beat: a floor pulse, sweeping spotlights at Home and an optional strobe (at most four flashes a second; in Gloamhold it flips the keep black for white; off when your system asks for reduced motion). Decks can be saved as <b>sets</b>, kept in the browser and in snapshots.</p><p>The background music can be <b>tweaked</b> too. Pick a <b>style</b>: follows the world (the default: Home or Gloamhold, whichever you're in), Home, Gloamhold, calm, dreamy, chiptune, gloomy or lo-fi (with swung drums and a little vinyl crackle). <b>↻ new variation</b> reshuffles its chords, rhythm and register. Under <i>tweak</i>: speed, key and scale, busyness, brightness, a level for each voice (pluck, pad, bells, drone, beat: the middle is the style as written, past the middle adds the voice even where the style has none), and whether it follows the weather and the day. A change lets the long notes go and starts the new music on its first chord, with a short dip instead of a click.</p><p>A tweak can be saved as a <b>track</b> (🌙 in the sets list): play it later as the background, or load it into the deck, where the filter, echo, crush, DROP and lights work on it, the grid's drums can play on top, and rave mode hears it (each style has its own tempo and its own mix of drums, bass and melody, so a chiptune track gets a different crowd from a gloomy one). The <b>set list</b> plays sets and tracks in order on the deck, a few minutes each, crossfading from one to the next, and loops; it goes along in snapshots.</p><p>With <b>🕺 rave</b> on, the creatures react to it: see <a href="#rave">rave mode</a>.</p>`;
  h += sec('rave', 'Rave mode', 3) + `<p>Turn on <b>🕺 rave</b> in the deck and press play: the creatures near you hear it, and each one reacts by its own <b>taste in music</b>, a set of genes that evolve like the rest: a favourite tempo, how loud it can take it, and how much it listens for drums, bass and melody (the card shows it: "likes ~128 bpm, mostly bass").</p><p>Those who like it <b>dance on the beat</b>, each body its own way: chips bob, triangles and stars spin a quarter turn on each kick, orbs bounce, long-legged ones high-step, the rest sway. Friends who both dance form <b>conga lines</b> behind each other; when the bass is heavy, the bass lovers gather into a <b>mosh</b> knot. Those who don't like it cover their ears and walk away; timid ones hide from the strobe; hangry ones keep eating; sleepers grumble and roll over, or wake up if it's loud.</p><p>The deck's <b>dancefloor meter</b> counts who's dancing, bored and leaving, and says what this crowd wants (faster, slower, more bass, quieter…). Dancing lifts their mood, hating it stresses them, and it all goes into their diaries and favourite sets; a rave becomes a reel: <i>the night of the rave</i>.</p>`;
  h += sec('code', 'Code as food, and charts breaking', 3) + `<p>Charts don't pile up. <b>Debuggers</b> take a chart that has been left alone for about 10 minutes of play apart into its <b>code</b>: it crumbles and falls out as tokens such as <code>&lt;path</code>, <code>plot(</code>, <code>x=</code>, <code>=&gt;</code>, <code>fill</code>, a word of Id|le, bits of its formula and some of its numbers (the numbers it was made from come back as number words). Code tokens are words on a dark chip in monospace.</p><p><b>Code is food.</b> Debugger kin and about a third of Tok kin (a gene, passed on and now and then flipped) eat code; when there's little code about they eat short words. Short code tokens (<code>x</code>, <code>fn</code>, <code>sin</code>) also suit the short-word eaters, and the numbers go to Counter kin. Code eaters also <b>bite charts directly</b> once a chart has been on the floor about 5 minutes of play: each bite takes a point off the curve and drops a code token, and the last bites break what's left into code. Pinned charts are never touched. The advisor's food line shows the code supply.</p>`;
  h += sec('advisor', 'The advisor', 3) + `<p>📊 in the top bar opens the <b>advisor</b>: how the creatures of the world you're in are doing, with a bar, a trend arrow (last minute) and a 10-minute line for each gauge: <b>fear</b> (hiding or afraid), <b>hunger</b>, <b>hurt</b>, <b>tiredness</b>, <b>crowding</b> (four or more neighbours within a step), <b>food supply</b> (what's on the floor for each diet, against how many eat it), <b>mood</b>, <b>friendships</b>, and the <b>dancefloor</b> while a rave is on.</p><p>When a gauge crosses a line it becomes an <b>issue</b>: what's wrong, why in plain words ("27 of 42 are hiding: packet storm for 40 min"), and one-click fixes that use the world's own verbs: calm the weather, stop the music, scatter food for the hungriest diet, let the scared, hurt or tired ones nap, put three to rest, throw a rave. Most can be undone. Issues clear only when things are clearly better, so they don't flicker on and off.</p><p>The <b>Id|le gazette</b> brings news in a small pill, at most one every couple of minutes: firsts (the first hangry, the first theft, the first chart), records (the longest conga, the biggest count), disasters, food shortages. Items with a place have a <b>go ›</b>. Alerts can be <b>on</b>, <b>quiet</b> (only a red dot on 📊) or <b>off</b>; records and firsts are kept in snapshots.</p>`;
  h += sec('space', 'Personal space', 3) + `<p>Every creature has a <b>personal space</b>: how many others it is comfortable having within a step, read from its <b>flocking</b> gene (it evolves with it). Loners are happy with one or two close by, the most social want eight or more. The card says which: <i>a loner, happy with 1 close by</i>, <i>loves company, up to 8 close by</i>.</p><p><b>Loners</b> packed past their comfort get <b>stressed</b> (and less happy and relaxed), stop being pulled along by their flock and <b>edge away</b>, sometimes to the lake's quiet shore. <b>Social</b> ones in good company, friends most of all, get a small lift; left alone for several minutes they start to <b>miss the others</b> (they feel left alone). A crowd also makes food go faster: hunger rises a little quicker when packed, and hungry creatures in a crowd steal more. Memories, mind lines and the gazette mark the moments: <i>too many legs here</i>, <i>love a crowd</i>, the first party, the first hermit. Togetherness on its own is never a problem in the advisor; it only raises <b>loners are stressed in a crowd</b> (three or more, about 8% of them), with <b>🫧 give the loners room</b> (each goes to the quietest spot nearby, or the shore) and <b>↔️ spread them out</b>.</p>`;
  h += sec('lake', 'The lake and the almanac', 3) + `<p>Every world has a <b>lake</b>, in its own style: soft blue water with drifting 0s and 1s at Home, a 1-bit black mere with white glints in Gloamhold. Each lake gets a name (Lake Buffers, the Pool of Stray Letters, the Black Mere…). <b>Rain and storms fill it</b>, and clear days slowly lower it. While it rains, loose words near the shore drift in and dissolve into <b>data fish</b>, letters that swim in circles. There are never more than ${24} fish, so no word is lost for long: hungry creatures on the shore <b>fish them back out</b> as words.</p><p>The lake is a <b>refuge</b>. A scared creature runs for the shore when it is close, fear fades much faster by the water, scares are rarer there, and getting calm is a memory ("calmed down by the Black Mere"). The advisor's fear issue offers 🌊 <i>walk the scared ones to the lake</i>. Creatures on the shore drink (it rests them) and gossip about what the almanac remembers.</p><p><b>The almanac</b> is the data lake itself: click the water, or 🌊 in the top bar. Every world <b>keeps its history</b> for real. The advisor's gauges are sampled once a minute and rolled up into hours and days: minutes are kept for 2 days, hours for 90 days, days for good. Alongside them sit who joined and who left (and how), and an event log: disasters, weather, names, raves, reels, friendships, hangry moments and thefts (counted every time, written down now and then), and the whole Id|le gazette. It shows trends by day, week, month, year and all time; population, new members, a sample of the gazette, the top reels (stars, plays, memories), and records and firsts. <b>🌊 all worlds</b> is the <b>data ocean</b>, every world together. Time is real time, and each world has an age (year 1, month 1, day 1 at first). A <b>research export</b> saves the raw history as JSON or CSV on your computer: nothing is uploaded. The history lives in this browser (IndexedDB, with or without a server), and the recent part rides along in snapshots and in the disk copy.</p>`;
  h += sec('objects', 'Solid objects and buildings', 3) + `<p>Some things in the world are <b>solid</b>. They come in each world's own style: <b>crates of bits</b>, <b>word-bricks</b> (a brick that carries a word), <b>data boulders</b> and <b>server racks</b> with blinking lights at Home, and stones, crates, bricks and <b>pillars</b> in 1-bit in Gloamhold. Creatures can't walk through them: they slide along them, steer round what's ahead, and take a short detour when they get stuck behind a corner.</p><p>Small ones (crates, bricks, stones) can be carried and pushed: a big creature shoves them as it walks, strong wind nudges them, a tornado drags them round and a volcano throws them out of the way. Big ones stay put. Each world starts with a few <b>quarries</b>, piles of small things, and a handful of big ones; the studio's <b>Objects</b> section adds more.</p><p><b>Your hand:</b> drag any object to move it. One you moved stays where you put it, and the creatures leave it alone. Click one to 📌 pin it (nothing moves it then), turn it, or remove it.</p><p><b>Architects</b> are the builders. One moves into each world. They carry loose small objects, one at a time, into a plan laid out as dotted outlines, and when the quarries run dry they press a long word into a new brick. They build a <b>hut</b> with a door: a shelter where scares are much rarer and fear fades fast, and scared creatures run for it, round to the door and in. They also build a <b>pen</b>, a quiet room that loners drift to and where tiredness drops; a <b>wall</b>, a windbreak with no wind push in its lee; and a <b>bench</b> by the lake to sit on. Each Architect has its own taste in shapes. A finished building gets a name from the words around it, and a Namer is credited if one lives here. A piece knocked out by a tornado, a volcano or your hand leaves a gap, and an Architect comes back to fix it. Building shows up in diaries, the Gazette ("the first building"), the almanac and replays. Objects and buildings are kept per world, in snapshots too.</p>`;
  h += sec('drawer', 'Your drawer', 3) + `<p>Anything you like can be <b>kept</b>: a chart, a design, a picture or a page piece, a word, a creature's <b>portrait</b> (its name, body, a few genes, how it felt and the last lines of its diary), a <b>reel</b> with its replays, a <b>building</b> (a picture of it, its name and who built it), or a <b>Gazette</b> clipping. Keeping makes a <b>copy</b>: the original stays in the world, where creatures can still eat it, break it into code or rework it. The copy is yours.</p><p>Ways in: right-click a thing and choose <b>🗄 keep a copy</b>, hover a chart or picture for the small <b>🗄 keep</b> button, <b>🗄 portrait</b> on a creature's card, <b>🗄</b> in the reel player, <b>🗄 keep</b> on a building's menu, and <b>🗄</b> on a Gazette pill or in the 🔔 history.</p><p>The <b>🗄 drawer</b> in the top bar shows everything by kind, and in <b>collections</b> you name yourself (+ collection, then drag things onto it). Open one to look at it large, rename it, add a note, <b>place a copy back in the world</b> (in the middle of your view), play a kept reel, or <b>export</b> it (PNG for anything visual, SVG for charts, text for words and clippings, JSON for everything). Removing asks nothing and can be undone; removed things wait under <b>removed</b> and can be put back.</p><p>The drawer is yours, not a world's: it is the same in Home, Gloamhold and any page you visit. It lives in this browser (IndexedDB) and rides along in every snapshot, merging in without ever losing anything. When a creature's work is kept it notices: it feels looked after, writes it in its diary, and a kept chart counts like a pin for its tastes.</p>`;
  h += sec('trees', 'Family trees', 3) + `<p>Every creature has a record of where it came from: its <b>parent</b>, its <b>generation</b> (founders are generation 0), when it was born, the genomes it has carried and what changed each time. Open <b>🌳</b> in the top bar, pick a family, and its trees are drawn generation by generation, each creature as a tiny portrait. The label on a line is the gene in which a child differs most from its parent. Drag to pan, scroll to zoom, click a creature for its card (or, if it is gone, for what is known about it).</p><p>The game never invents ancestry; it reads what the genomes already carry. A <b>clone</b> keeps the id of the one it was copied from plus a short mark, so its parent is certain. A creature <b>mutated</b> from another genome names that genome as its parent. A <b>metamorphosis</b> (wings, a new body) is the same creature changing, not a child. When none of that can be read, the creature is a root marked <b>? unknown origin</b>. When several clones name a genome nobody recorded carrying, they share an <b>unrecorded ancestor</b> (dashed). Gone creatures stay in the tree, faded; resting ones show 💤.</p><p>Highlights: the founders, the <b>longest line</b>, who has had the <b>most children</b>, <b>extinct branches</b> (a branch with nobody left here or resting), and how a chosen gene <b>drifted</b> from generation to generation, on average and down the longest line. A new deepest generation and the first great-grandchild make the Gazette. The card's friends tab shows the family line with <b>↗ tree</b>. Everything exports as CSV or JSON (one row per creature: id, parent, generation, genes) for your own studies, and rides along in snapshots without ever losing a record.</p>`;
  h += sec('babies', 'Children', 3) + `<p>Creatures have children of their own. Two <b>good friends</b>, close together, both well fed, rested and not scared, now and then have a child (sometimes <b>twins</b>); very rarely a loner with nobody about <b>buds</b> a near-copy of itself. Each of the child's genes comes from one parent or a blend of both (tastes such as charts or counting come whole from one), then a small mutation, the same kind evolution makes. Its family and the style of its name follow a parent. It starts small and grows with every meal, and only a grown creature can become a parent; parents rest a while after a birth.</p><p>Births need <b>food nearby</b> and <b>room</b>: friends packed past their personal space have none. Each world has a <b>population cap</b> (studio → <b>Children</b>, 60 by default): at the cap births simply stop, and nobody is ever removed. The same strip turns children off for that world. Parents and child remember the day in their diaries and become friends; the family tree shows both parents (the second as a dotted pink line); the Gazette has the first baby, the first twins and the first child of two families; a birth is a replay moment and makes a reel, <i>A new arrival</i>; the almanac logs every birth, and the advisor says how many there were in the last hour and, when there are none, why.</p>`;
  h += sec('looks', 'Showy, shy and dazzle herds', 3) + `<p>Every creature carries a <b>showiness</b> gene (0 to 1), passed on to its children and nudged by mutation; social creatures lean showy. <b>Showy</b> ones glow softly in their own colour, pulse when they're happy or dancing, and leave little <b>ripples</b> where their feet land. <b>Shy</b> ones are camouflaged: they fade toward the floor under them and leave no trace. When shy kin move together they form a <b>dazzle herd</b>: they share a stripe pattern, so the herd reads as one moving mass and no single member stands out.</p><p>It matters to them. Showy creatures make friends faster, but they get noticed: thieves pick them first and scares find them more often. Shy ones are robbed less (a thief can lose track of them, more so in a herd) and scared less, but they make friends more slowly. The card shows each creature's looks.</p><p>For you: in a busy view every creature gets a faint halo so it stands apart from the word-bricks, the one under your pointer gets a ring, and <b>highlight creatures</b> (⚙ settings, the ✨ tile on phones, tap or hold <b>H</b>) rings every one, camouflaged or not.</p>`;
  h += sec('first5', 'The first five minutes', 3) + `<p>A browser that has never kept a world doesn't start on an empty floor: it arrives in <b>a small world</b> that is already living (a dozen creatures mid-day: one asleep, one hungry, two friends, a Mathematician with charts out, a Counter, a Designer and an Architect with a pile of crates, words on the floor and a lake). A short <b>trail of tips</b> arrives as 🧭 pills, one at a time, each with <b>show me ›</b>: open a card, name someone, feed the hungry one, watch the sleeper dream, follow a Gazette pill, try another weather, play the first reel, keep something in the drawer. Each tip counts as done however you get there, <b>I'll explore</b> ends them for good, and the ring on 🔔 shows how far along you are. Early on the world asks for <b>a name</b>; after about ten minutes it suggests <b>saving a backup file</b>, because a world kept in browser storage is gone if the browser's data is cleared. When each of those firsts happened stays in your browser (the almanac shows it); nothing is sent anywhere. A world you already have never sees any of this.</p>`;
  h += sec('evolution', 'Evolution', 3) + `<p>Creatures evolve: a mutation copies a genome with small changes, and you choose what to keep. The world evolves too (layout, tilt, weather, ground, fonts), from the 🌦 evolve button, and you can keep worlds you like.</p>`;
  h += sec('snapshots', 'Snapshots and saving'); h += `<p>Everything in a world can be kept: 📸 <b>snapshot</b> saves the creatures (with their genomes, lives, diaries, friends and ledgers), the residents and the resting, the namers, the world and its weather, the words, and any captured page. The world also autosaves as you play, and snapshots are mirrored to disk. Restoring or leaving never throws anything away: the old state goes into the snapshot list first.</p>`;

    pop.style.top = (r.bottom + pop.offsetHeight + 8 > innerHeight ? Math.max(scrollY + 8, r.top + scrollY - pop.offsetHeight - 6) : r.bottom + scrollY + 6) + 'px'; }
  function openInArena(name) {   // a visible switch: name the tab that opened this page, then navigate and focus it by that name
    try { if (window.opener && !window.opener.closed && window.opener.location.pathname.endsWith('/arena.html')) window.opener.name = 'idle-arena'; } catch (e) {}
    const w = window.open('arena.html#c=' + encodeURIComponent(name), 'idle-arena'); if (!w) return; try { w.focus(); } catch (e) {}
    // an already-open world only changed its #hash (no reload), so tell that one tab, now in front, to go to the creature
    // (the same path as clicking a name in a memory there: fly to it, select it, open its card)
    try { if (w.document.readyState === 'complete' && w.__arena) { const m = w.document.createElement('a'); m.className = 'mn'; m.dataset.n = name; m.style.display = 'none';
      w.document.body.appendChild(m); m.click(); m.remove(); w.history.replaceState(null, '', w.location.pathname); } } catch (e) {} }
  document.addEventListener('click', e => { const a = e.target.closest('a[data-go]');
    if (a) { e.preventDefault(); profile(a.dataset.go, a); return; }
    const o = e.target.closest('[data-open]'); if (o) { openInArena(o.dataset.open); return; }
    if (e.target.closest('[data-x]') || !e.target.closest('#pop')) pop.classList.remove('on'); });
  addEventListener('keydown', e => { if (e.key === 'Escape') pop.classList.remove('on'); });
  if (!draw) return;
  // static minis for your world, live boxes for families
  for (const s of document.querySelectorAll('svg[data-mini]')) { try { const g = JSON.parse(s.dataset.mini), c = creature(g, 1); c.x = 70; c.y = 52; c.heading = -0.4; draw.buildLegs(c); s.innerHTML = draw.legsSVG(c) + draw.bodySVG(c, 0); } catch (e) {} }
  for (const s of document.querySelectorAll('svg.live[data-fam]')) liveBox(s, genomeOf(s.dataset.fam));
  { const s = document.querySelector('svg.live[data-bodies]'); if (s) { let i = 0; const L = liveBox(s, { ...DG.tok, body: BODIES[0] }); setInterval(() => { if (!L.vis) return; i = (i + 1) % BODIES.length; L.c.g = { ...L.c.g, body: BODIES[i], hue: (L.c.g.hue + 61) % 360 }; draw.buildLegs(L.c); }, 3200); } }
  const io = new IntersectionObserver(es => es.forEach(e => { const L = lives.find(x => x.svg === e.target); if (L) L.vis = e.isIntersecting; })); lives.forEach(L => io.observe(L.svg));
  // margin crawlers: a few small creatures from your world (or the families) walking the edges, sometimes across the text
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, crawlSvg = $('#crawl'), roamers = [];
  const pool = living.length ? living.map(x => x.g) : famKeys.map(genomeOf);
  for (let i = 0; i < (reduce ? 0 : 4); i++) { const g = pick(pool), c = creature(g, Math.max(Math.min(0.42, 22 / ((g.l1 + g.l2) || 50)), 7 / (g.bodyW || 15))), vw = () => innerWidth, vh = () => innerHeight;
    c.next = () => { const edge = Math.random(); if (edge < 0.12) return [Math.random() * vw(), Math.random() * vh()]; const left = Math.random() < 0.5, mx = Math.max(30, Math.min(160, (vw() - 1180) / 2 + 60)); return [left ? 12 + Math.random() * mx : vw() - 12 - Math.random() * mx, 20 + Math.random() * (vh() - 40)]; };
    const p = c.next(); c.x = c.tx = p[0]; c.y = c.ty = p[1]; draw.buildLegs(c); c.rest = 0; roamers.push(c); }
  let fr = 0;
  function tick(t) { requestAnimationFrame(tick); if (document.hidden || (++fr & 1)) return;
    for (const L of lives) if (L.vis) L.svg.innerHTML = stepC(L.c, t, L.W, L.H, 34);
    if (roamers.length) crawlSvg.innerHTML = roamers.map(c => `<g opacity=".8">${stepC(c, t, innerWidth, innerHeight, 20)}</g>`).join('');
    wxTick(t); }
  // weather in the header: your world's weather, lightly
  const cv = $('#wx'), cx = cv.getContext('2d'), wk = worldNow.weather || 'clear', parts = Array.from({ length: reduce ? 0 : 46 }, () => ({ x: Math.random(), y: Math.random(), s: 0.3 + Math.random() }));
  function wxTick() { const W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight; cx.clearRect(0, 0, W, H); const ink = isDark() ? '200,210,255' : '40,60,140';
    for (const p of parts) { if (wk === 'clear') break;
      if (wk === 'bitrain' || wk === 'storm') { p.y += 0.012 * p.s * (wk === 'storm' ? 2 : 1); if (p.y > 1) { p.y = 0; p.x = Math.random(); } cx.fillStyle = `rgba(${ink},${0.25 + 0.3 * p.s})`; cx.font = '10px ui-monospace,Menlo,monospace'; cx.fillText(p.s > 0.8 ? '1' : '0', p.x * W, p.y * H); }
      else if (wk === 'wind') { p.x += 0.004 * p.s; if (p.x > 1) { p.x = 0; p.y = Math.random(); } cx.strokeStyle = `rgba(${ink},.25)`; cx.beginPath(); cx.moveTo(p.x * W, p.y * H); cx.lineTo(p.x * W + 14 * p.s, p.y * H); cx.stroke(); }
      else if (wk === 'static') { if (Math.random() < 0.3) { cx.fillStyle = `rgba(${ink},.4)`; cx.fillRect(Math.random() * W, Math.random() * H, 2, 2); } }
      else if (wk === 'fog') { p.x += 0.0006 * p.s; if (p.x > 1.1) p.x = -0.1; const g = cx.createRadialGradient(p.x * W, p.y * H, 0, p.x * W, p.y * H, 40 * p.s); g.addColorStop(0, `rgba(${ink},.06)`); g.addColorStop(1, `rgba(${ink},0)`); cx.fillStyle = g; cx.fillRect(p.x * W - 50, p.y * H - 50, 100, 100); }
      else if (wk === 'hum') { cx.strokeStyle = `rgba(${ink},.12)`; cx.beginPath(); for (let x = 0; x < W; x += 6) cx.lineTo(x, H * p.y + Math.sin(x / 18 + performance.now() / 200 + p.s * 9) * 3); cx.stroke(); if (p.s > 0.5) break; } } }
  requestAnimationFrame(tick);
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
  window.__pedia = { missing, families: famKeys, living: living.length };
})();
