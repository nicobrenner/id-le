name: smoke tests

# tools/test_smoke.py: every script's syntax, the helper Worker's rules, and a static build checked in Chromium and
# WebKit (iPhone profile). Nothing reaches the network beyond installing the tools: the test page's outside requests are stubbed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium webkit
      - name: Smoke tests
        run: python3 tools/test_smoke.py
